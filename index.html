document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Syne';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"a935223b-fb1d-446f-9a34-1ed68d0ba773\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  *{box-sizing:border-box;}\n  html{scroll-behavior:smooth;}\n  body{margin:0;}\n  ::selection{background:rgba(176,141,76,.22);}\n<\u002Fstyle>\n<\u002Fhelmet>\n<div id=\"top\" ref=\"{{ setRoot }}\" style=\"--bg:#F6F2EA;--surface:#FFFFFF;--surface2:#FBF7F0;--ink:#15120D;--muted:#6E675B;--line:rgba(21,18,13,.12);--gold:#B08D4C;--gold-soft:rgba(176,141,76,.13);--fdisp:'Cormorant Garamond',Georgia,serif;--fbody:'Jost',system-ui,sans-serif;--rad:2px;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--fbody);font-weight:300;-webkit-font-smoothing:antialiased;transition:background .5s ease,color .5s ease;overflow-x:hidden\">\n\n  <!-- ===================== AVISO AFILIADOS ===================== -->\n  <div style=\"background:var(--ink);color:color-mix(in srgb, var(--bg) 70%, transparent);text-align:center;font-size:11.5px;letter-spacing:.03em;padding:7px 16px;line-height:1.5\">\n    Aromia contiene enlaces de afiliado · podemos ganar comisión por compras cualificadas, sin coste extra para ti.\n  <\u002Fdiv>\n\n  <!-- ===================== NAV ===================== -->\n  <header style=\"position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:color-mix(in srgb, var(--bg) 84%, transparent);border-bottom:1px solid var(--line)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:15px 30px;display:flex;align-items:center;gap:26px\">\n      <a href=\"#top\" style=\"font-family:var(--fdisp);font-weight:700;font-size:23px;letter-spacing:.34em;color:var(--ink);text-decoration:none;padding-left:.34em\">AROMIA<\u002Fa>\n      <nav style=\"display:flex;gap:26px;margin-left:14px;flex:1\">\n        <a href=\"#tienda\" style=\"font-family:var(--fbody);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .25s\" style-hover=\"color:var(--ink)\">Magazine<\u002Fa>\n        <a href=\"#tienda\" style=\"font-family:var(--fbody);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .25s\" style-hover=\"color:var(--ink)\">Tienda<\u002Fa>\n        <a href=\"#estudio\" style=\"font-family:var(--fbody);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .25s\" style-hover=\"color:var(--ink)\">Lab<\u002Fa>\n        <a href=\"#academia\" style=\"font-family:var(--fbody);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .25s\" style-hover=\"color:var(--ink)\">Academia<\u002Fa>\n        <a href=\"#academia\" style=\"font-family:var(--fbody);font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-decoration:none;transition:color .25s\" style-hover=\"color:var(--ink)\">Club<\u002Fa>\n      <\u002Fnav>\n      <div style=\"display:flex;align-items:center;gap:9px\">\n        <button onclick=\"{{ toggleStyle }}\" style=\"font-family:var(--fbody);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;transition:.25s\" style-hover=\"border-color:var(--gold);color:var(--ink)\">{{ styleLabel }}<\u002Fbutton>\n        <button onclick=\"{{ toggleMode }}\" aria-label=\"modo\" style=\"width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);background:transparent;border:1px solid var(--line);border-radius:999px;cursor:pointer;font-size:14px;transition:.25s\" style-hover=\"border-color:var(--gold);color:var(--ink)\">{{ modeIcon }}<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ===================== HERO ===================== -->\n  <section style=\"max-width:1240px;margin:0 auto;padding:74px 30px 56px;display:grid;grid-template-columns:1.05fr .95fr;gap:54px;align-items:center\">\n    <div>\n      <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:26px\">\n        <span style=\"width:34px;height:1px;background:var(--gold)\"><\u002Fspan>\n        <span style=\"font-family:var(--fbody);font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)\">La autoridad editorial que además vende<\u002Fspan>\n      <\u002Fdiv>\n      <h1 style=\"font-family:var(--fdisp);font-weight:var(--disp-weight,600);font-size:clamp(46px,5.6vw,80px);line-height:1.02;letter-spacing:var(--disp-spacing,.004em);margin:0 0 24px\">No vendemos perfumes.<br><em style=\"font-style:italic;color:var(--gold)\">Revelamos identidades.<\u002Fem><\u002Fh1>\n      <p style=\"max-width:454px;font-size:17px;line-height:1.7;color:var(--muted);margin:0 0 34px\">Magazine, Lab, Tienda y Academia en un solo ecosistema. Aprende a leer una fragancia —su pirámide, su longevidad, su estela— antes de elegir la que cuenta tu historia.<\u002Fp>\n      <div style=\"display:flex;align-items:center;gap:22px;flex-wrap:wrap\">\n        <a href=\"#tienda\" style=\"display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);font-family:var(--fbody);font-size:12.5px;letter-spacing:.16em;text-transform:uppercase;text-decoration:none;padding:15px 26px;border-radius:var(--rad);transition:.3s\" style-hover=\"background:var(--gold);color:#fff\">Explorar la colección<span style=\"font-size:15px\">→<\u002Fspan><\u002Fa>\n        <a href=\"#academia\" style=\"font-family:var(--fbody);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:4px;transition:.25s\" style-hover=\"color:var(--gold)\">Cómo leer un perfume<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:42px;margin-top:54px\">\n        <div><div style=\"font-family:var(--fdisp);font-size:34px;color:var(--ink);line-height:1\">240+<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px\">Reseñas honestas<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:var(--fdisp);font-size:34px;color:var(--ink);line-height:1\">98<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px\">Ingredientes estudiados<\u002Fdiv><\u002Fdiv>\n        <div><div style=\"font-family:var(--fdisp);font-size:34px;color:var(--ink);line-height:1\">6<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px\">Casas en el Lab<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"position:relative\">\n      <div style=\"position:relative;aspect-ratio:4/5;border-radius:var(--rad);overflow:hidden;background:linear-gradient(150deg,#cdb89a,#7c6448 70%);box-shadow:0 40px 80px -36px rgba(40,28,12,.45)\">\n        <div style=\"position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;font-family:var(--fdisp);font-size:120px;color:rgba(255,255,255,.16);padding-bottom:18px\">A<\u002Fdiv>\n        <img src=\"b6b6dd88-f522-4369-ae39-6ae9ef8d9d1b\" alt=\"Aromia perfume editorial\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n      <\u002Fdiv>\n      <div style=\"position:absolute;left:-24px;bottom:34px;background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:16px 20px;box-shadow:0 24px 48px -24px rgba(20,14,6,.4);max-width:220px\">\n        <div style=\"font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:7px\">Perfume del mes<\u002Fdiv>\n        <div style=\"font-family:var(--fdisp);font-size:23px;line-height:1.05;color:var(--ink)\">Ámbar Nómada<\u002Fdiv>\n        <div style=\"font-size:12px;color:var(--muted);margin-top:4px\">Ámbar especiado · 50 ml<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== TIENDA / COLECCIÓN ===================== -->\n  <section id=\"tienda\" style=\"max-width:1240px;margin:0 auto;padding:64px 30px 30px\">\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:42px;border-bottom:1px solid var(--line);padding-bottom:26px\">\n      <div>\n        <div style=\"font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px\">La Colección<\u002Fdiv>\n        <h2 style=\"font-family:var(--fdisp);font-weight:var(--disp-weight,600);font-size:clamp(32px,3.6vw,48px);line-height:1.05;letter-spacing:var(--disp-spacing,.004em);margin:0\">Seis fragancias, seis identidades.<\u002Fh2>\n      <\u002Fdiv>\n      <a href=\"#estudio\" style=\"font-family:var(--fbody);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);text-decoration:none;white-space:nowrap;border-bottom:1px solid var(--line);padding-bottom:4px;transition:.25s\" style-hover=\"color:var(--gold);border-color:var(--gold)\">Ver todo el Lab →<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:30px 26px\">\n      <sc-for list=\"{{ perfumes }}\" as=\"p\" hint-placeholder-count=\"6\">\n        <a href=\"#estudio\" style=\"text-decoration:none;color:inherit;display:flex;flex-direction:column;group\">\n          <div style=\"position:relative;aspect-ratio:3/4;border-radius:var(--rad);overflow:hidden;background:{{ p.grad }};margin-bottom:16px\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fdisp);font-size:80px;color:rgba(255,255,255,.18)\">{{ p.initial }}<\u002Fdiv>\n            <img src=\"{{ p.img }}\" alt=\"{{ p.name }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .9s cubic-bezier(.16,1,.3,1)\" style-hover=\"transform:scale(1.05)\">\n            <div style=\"position:absolute;top:12px;left:12px;background:color-mix(in srgb, var(--bg) 88%, transparent);backdrop-filter:blur(6px);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);padding:6px 10px;border-radius:999px\">{{ p.family }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:10px\">\n            <h3 style=\"font-family:var(--fdisp);font-weight:600;font-size:24px;margin:0;line-height:1.1\">{{ p.name }}<\u002Fh3>\n            <span style=\"font-family:var(--fbody);font-size:15px;color:var(--ink);white-space:nowrap\">{{ p.price }}<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-top:5px\">{{ p.house }} · {{ p.perfumer }}<\u002Fdiv>\n          <div style=\"font-size:13px;color:var(--muted);margin-top:11px;line-height:1.5\">{{ p.notes }}<\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:10px;margin-top:14px\">\n            <span style=\"font-size:14px;color:var(--gold);letter-spacing:2px\">{{ p.starsStr }}<\u002Fspan>\n            <span style=\"font-size:12px;color:var(--muted)\">{{ p.rating }}<\u002Fspan>\n            <span style=\"margin-left:auto;font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);border-bottom:1px solid var(--gold);padding-bottom:2px\">Descubrir<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fa>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== ESTUDIO DEL PERFUME (FICHA) ===================== -->\n  <section id=\"estudio\" style=\"background:var(--surface2);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-top:64px\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:78px 30px\">\n      <div style=\"text-align:center;margin-bottom:54px\">\n        <div style=\"font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px\">El Estudio · Lab Aromia<\u002Fdiv>\n        <h2 style=\"font-family:var(--fdisp);font-weight:var(--disp-weight,600);font-size:clamp(34px,4vw,54px);line-height:1.04;margin:0\">Anatomía de una fragancia<\u002Fh2>\n        <p style=\"max-width:560px;margin:18px auto 0;font-size:16px;line-height:1.7;color:var(--muted)\">Cada perfume del Lab se disecciona con honestidad: rendimiento real en piel, carácter, pirámide olfativa y la voz de la comunidad.<\u002Fp>\n      <\u002Fdiv>\n\n      <!-- top: gallery + details -->\n      <div style=\"display:grid;grid-template-columns:.92fr 1.08fr;gap:50px;align-items:start\">\n        <div>\n          <div style=\"position:relative;aspect-ratio:1/1;border-radius:var(--rad);overflow:hidden;background:linear-gradient(150deg,#cdb89a,#6e5638 75%);box-shadow:0 36px 70px -34px rgba(40,28,12,.5)\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fdisp);font-size:150px;color:rgba(255,255,255,.14)\">A<\u002Fdiv>\n            <img src=\"{{ mainImg }}\" alt=\"Ámbar Nómada\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n          <\u002Fdiv>\n          <div style=\"display:flex;gap:12px;margin-top:14px\">\n            <sc-for list=\"{{ thumbs }}\" as=\"t\" hint-placeholder-count=\"4\">\n              <button onclick=\"{{ t.click }}\" style=\"flex:1;aspect-ratio:1/1;border-radius:var(--rad);overflow:hidden;border:1px solid {{ t.border }};padding:0;cursor:pointer;background:{{ t.grad }};position:relative;transition:.25s\">\n                <img src=\"{{ t.u }}\" alt=\"vista\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div>\n          <div style=\"font-size:11.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:12px\">Ámbar especiado · Amaderado oriental<\u002Fdiv>\n          <h3 style=\"font-family:var(--fdisp);font-weight:var(--disp-weight,600);font-size:clamp(38px,4.4vw,58px);line-height:1;margin:0 0 10px\">Ámbar Nómada<\u002Fh3>\n          <div style=\"font-size:14px;color:var(--muted);margin-bottom:22px\">Aromia Lab · Nariz <em style=\"color:var(--ink);font-style:italic\">Élise Marchand<\u002Fem> · 2025<\u002Fdiv>\n          <p style=\"font-size:16.5px;line-height:1.75;color:var(--muted);margin:0 0 26px;max-width:520px\">Un ámbar que viaja: abre con la chispa del cardamomo y el jengibre sobre bergamota soleada, se asienta en un corazón de iris y azafrán, y termina envolviéndote en sándalo lácteo, vainilla y vetiver. Cálido, sofisticado, nómada.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:24px;flex-wrap:wrap;padding:22px 0 18px;border-top:1px solid var(--line);margin-bottom:18px\">\n            <div><div style=\"font-family:var(--fdisp);font-size:30px;line-height:1\">Desde 128 €<\u002Fdiv><div style=\"font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px\">Eau de Parfum · 50 ml<\u002Fdiv><\u002Fdiv>\n            <div style=\"height:38px;width:1px;background:var(--line)\"><\u002Fdiv>\n            <div style=\"font-size:13px;color:var(--muted);line-height:1.6\">Concentración <strong style=\"color:var(--ink);font-weight:500\">18%<\u002Fstrong><br>Difusión <strong style=\"color:var(--ink);font-weight:500\">Alta<\u002Fstrong><\u002Fdiv>\n          <\u002Fdiv>\n          <!-- COMPARADOR DE TIENDAS (AFILIADOS) -->\n          <div style=\"border:1px solid var(--line);border-radius:var(--rad);overflow:hidden;margin-bottom:22px\">\n            <sc-for list=\"{{ retailers }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <a href=\"{{ r.url }}\" target=\"_blank\" rel=\"sponsored noopener\" style=\"text-decoration:none;color:inherit;display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line);transition:.2s;background:var(--surface)\" style-hover=\"background:var(--gold-soft)\">\n                <span style=\"font-size:13.5px;color:var(--ink);font-weight:500;min-width:110px\">{{ r.name }}<\u002Fspan>\n                <span style=\"font-size:12px;color:var(--muted);flex:1\">{{ r.tag }}<\u002Fspan>\n                <span style=\"font-family:var(--fdisp);font-size:19px;color:var(--ink)\">{{ r.price }}<\u002Fspan>\n                <span style=\"font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);border-bottom:1px solid var(--gold);padding-bottom:2px;white-space:nowrap\">Ver oferta →<\u002Fspan>\n              <\u002Fa>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:11.5px;color:var(--muted);line-height:1.6;margin-bottom:26px;display:flex;align-items:flex-start;gap:8px\">\n            <span style=\"color:var(--gold)\">ⓘ<\u002Fspan>\n            <span>Aromia participa en programas de afiliados. Al comprar a través de estos enlaces podemos recibir una comisión, sin coste adicional para ti — esto financia nuestro trabajo editorial independiente.<\u002Fspan>\n          <\u002Fdiv>\n          <!-- PERFORMANCE BARS -->\n          <div ref=\"{{ setViz }}\">\n            <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:18px\">Rendimiento en piel<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;gap:18px\">\n              <sc-for list=\"{{ metrics }}\" as=\"m\" hint-placeholder-count=\"4\">\n                <div>\n                  <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px\">\n                    <span style=\"font-size:13.5px;color:var(--ink);letter-spacing:.02em\">{{ m.k }}<\u002Fspan>\n                    <span style=\"font-size:12px;color:var(--muted)\">{{ m.d }}<\u002Fspan>\n                  <\u002Fdiv>\n                  <div style=\"position:relative;height:6px;background:var(--gold-soft);border-radius:999px;overflow:hidden\">\n                    <div ref=\"{{ collectBar }}\" data-val=\"{{ m.pct }}\" style=\"position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--gold),color-mix(in srgb,var(--gold) 60%, #fff));border-radius:999px;transition:width 1.5s cubic-bezier(.16,1,.3,1)\"><\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- modules: radar + pyramid -->\n      <div style=\"display:grid;grid-template-columns:1fr 1.25fr;gap:26px;margin-top:30px\">\n        <!-- RADAR -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:30px 28px\">\n          <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px\">Carácter del aroma<\u002Fdiv>\n          <h4 style=\"font-family:var(--fdisp);font-weight:600;font-size:24px;margin:0 0 8px\">El retrato olfativo<\u002Fh4>\n          <div style=\"display:flex;justify-content:center\">\n            <svg viewBox=\"0 0 240 240\" style=\"width:100%;max-width:300px;overflow:visible\">\n              <sc-for list=\"{{ radarGrid }}\" as=\"g\" hint-placeholder-count=\"3\">\n                <polygon points=\"{{ g }}\" fill=\"none\" stroke=\"var(--line)\" stroke-width=\"1\"><\u002Fpolygon>\n              <\u002Fsc-for>\n              <sc-for list=\"{{ radarSpokes }}\" as=\"s\" hint-placeholder-count=\"6\">\n                <line x1=\"{{ s.x1 }}\" y1=\"{{ s.y1 }}\" x2=\"{{ s.x2 }}\" y2=\"{{ s.y2 }}\" stroke=\"var(--line)\" stroke-width=\"1\"><\u002Fline>\n              <\u002Fsc-for>\n              <g ref=\"{{ setRadar }}\" style=\"transform:scale(0);transform-origin:120px 120px;transition:transform 1.3s cubic-bezier(.16,1,.3,1)\">\n                <polygon points=\"{{ radarPoints }}\" fill=\"color-mix(in srgb, var(--gold) 24%, transparent)\" stroke=\"var(--gold)\" stroke-width=\"2\" stroke-linejoin=\"round\"><\u002Fpolygon>\n              <\u002Fg>\n              <sc-for list=\"{{ radarLabels }}\" as=\"l\" hint-placeholder-count=\"6\">\n                <g>\n                  <circle cx=\"{{ l.dx }}\" cy=\"{{ l.dy }}\" r=\"2.4\" fill=\"var(--gold)\"><\u002Fcircle>\n                  <text x=\"{{ l.x }}\" y=\"{{ l.y }}\" text-anchor=\"{{ l.anchor }}\" style=\"font-family:var(--fbody);font-size:10.5px;fill:var(--muted);letter-spacing:.04em\">{{ l.name }}<\u002Ftext>\n                <\u002Fg>\n              <\u002Fsc-for>\n            <\u002Fsvg>\n          <\u002Fdiv>\n          <p style=\"font-size:13px;line-height:1.6;color:var(--muted);margin:10px 0 0;text-align:center\">Dominante <strong style=\"color:var(--ink);font-weight:500\">especiado-cálido<\u002Fstrong>, con una base amaderada y un guiño floral.<\u002Fp>\n        <\u002Fdiv>\n\n        <!-- PYRAMID -->\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:30px 30px\">\n          <div style=\"display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px\">\n            <div>\n              <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:4px\">Pirámide olfativa<\u002Fdiv>\n              <h4 style=\"font-family:var(--fdisp);font-weight:600;font-size:24px;margin:0\">Cómo evoluciona en tu piel<\u002Fh4>\n            <\u002Fdiv>\n            <span style=\"font-size:11.5px;color:var(--muted)\">Toca cada nivel ↓<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px;align-items:center\">\n            <div style=\"display:flex;flex-direction:column;align-items:center;gap:9px\">\n              <sc-for list=\"{{ bands }}\" as=\"b\" hint-placeholder-count=\"3\">\n                <button onclick=\"{{ b.click }}\" style=\"width:{{ b.width }};border:1px solid {{ b.bd }};background:{{ b.bg }};color:{{ b.fg }};border-radius:var(--rad);padding:15px 12px;cursor:pointer;text-align:center;transition:.3s;font-family:var(--fbody)\">\n                  <div style=\"font-size:13.5px;letter-spacing:.08em;text-transform:uppercase\">{{ b.label }}<\u002Fdiv>\n                  <div style=\"font-size:11px;opacity:.7;margin-top:3px\">{{ b.time }}<\u002Fdiv>\n                <\u002Fbutton>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-family:var(--fdisp);font-size:26px;line-height:1.05;margin-bottom:4px\">{{ aTier.label }}<\u002Fdiv>\n              <div style=\"font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:12px\">{{ aTier.time }}<\u002Fdiv>\n              <p style=\"font-size:13.5px;line-height:1.65;color:var(--muted);margin:0 0 16px\">{{ aTier.desc }}<\u002Fp>\n              <div style=\"display:flex;flex-wrap:wrap;gap:8px\">\n                <sc-for list=\"{{ aTier.notes }}\" as=\"n\" hint-placeholder-count=\"3\">\n                  <span style=\"font-size:12.5px;color:var(--ink);background:var(--gold-soft);border:1px solid var(--line);border-radius:999px;padding:7px 13px\">{{ n }}<\u002Fspan>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- RATING -->\n      <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:34px 36px;margin-top:26px;display:grid;grid-template-columns:auto 1fr auto;gap:44px;align-items:center\">\n        <div style=\"text-align:center\">\n          <div style=\"font-family:var(--fdisp);font-size:64px;line-height:1;color:var(--ink)\">{{ avgStr }}<\u002Fdiv>\n          <div style=\"position:relative;display:inline-block;margin-top:8px;font-size:20px;letter-spacing:3px\">\n            <span style=\"color:var(--line)\">★★★★★<\u002Fspan>\n            <span ref=\"{{ setStarFill }}\" style=\"position:absolute;left:0;top:0;width:0;overflow:hidden;white-space:nowrap;color:var(--gold);transition:width 1.4s cubic-bezier(.16,1,.3,1)\">★★★★★<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--muted);margin-top:8px\">{{ votes }} valoraciones<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-left:1px solid var(--line);padding-left:44px\">\n          <div style=\"font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:6px\">La voz de la comunidad<\u002Fdiv>\n          <p style=\"font-family:var(--fdisp);font-size:22px;line-height:1.35;font-style:italic;color:var(--ink);margin:0\">«Empieza chispeante y termina como un abrazo. El ámbar nunca se vuelve pesado.»<\u002Fp>\n          <div style=\"font-size:12.5px;color:var(--muted);margin-top:10px\">— 1.284 reseñas verificadas · 92% lo recomienda<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"text-align:center;border-left:1px solid var(--line);padding-left:44px\">\n          <div style=\"font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px\">Tu valoración<\u002Fdiv>\n          <div onmouseleave=\"{{ starsLeave }}\" style=\"display:flex;gap:5px;justify-content:center;font-size:30px;cursor:pointer\">\n            <sc-for list=\"{{ userStars }}\" as=\"u\" hint-placeholder-count=\"5\">\n              <span onmouseenter=\"{{ u.enter }}\" onclick=\"{{ u.click }}\" style=\"color:{{ u.color }};transition:.15s;transform:{{ u.scale }}\">★<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"font-size:12px;color:var(--muted);margin-top:10px;min-height:16px\">{{ ratingMsg }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== ACADEMIA ===================== -->\n  <section id=\"academia\" style=\"max-width:1240px;margin:0 auto;padding:84px 30px 40px\">\n    <div style=\"text-align:center;margin-bottom:50px\">\n      <div style=\"font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:14px\">Academia Aromia<\u002Fdiv>\n      <h2 style=\"font-family:var(--fdisp);font-weight:var(--disp-weight,600);font-size:clamp(34px,4vw,54px);line-height:1.04;margin:0\">Cómo leer una fragancia<\u002Fh2>\n      <p style=\"max-width:560px;margin:18px auto 0;font-size:16px;line-height:1.7;color:var(--muted)\">Antes de comprar, entiende. Tres conceptos que cambian para siempre tu forma de elegir un perfume.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:26px;margin-bottom:80px\">\n      <sc-for list=\"{{ lessons }}\" as=\"le\" hint-placeholder-count=\"3\">\n        <div style=\"background:var(--surface);border:1px solid var(--line);border-radius:var(--rad);padding:34px 30px\">\n          <div style=\"font-family:var(--fdisp);font-size:40px;color:var(--gold);line-height:1;margin-bottom:18px\">{{ le.num }}<\u002Fdiv>\n          <h4 style=\"font-family:var(--fdisp);font-weight:600;font-size:25px;margin:0 0 12px\">{{ le.title }}<\u002Fh4>\n          <p style=\"font-size:14.5px;line-height:1.7;color:var(--muted);margin:0 0 16px\">{{ le.body }}<\u002Fp>\n          <div style=\"font-size:12.5px;letter-spacing:.06em;color:var(--gold);border-top:1px solid var(--line);padding-top:14px\">{{ le.tip }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n\n    <!-- INGREDIENTES -->\n    <div style=\"display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:34px;border-bottom:1px solid var(--line);padding-bottom:24px\">\n      <div>\n        <div style=\"font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:12px\">El jardín de Aromia<\u002Fdiv>\n        <h3 style=\"font-family:var(--fdisp);font-weight:var(--disp-weight,600);font-size:clamp(28px,3.2vw,42px);line-height:1.05;margin:0\">Los ingredientes, uno a uno<\u002Fh3>\n      <\u002Fdiv>\n      <span style=\"font-size:12px;color:var(--muted);white-space:nowrap\">Toca un ingrediente para descubrirlo<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:20px\">\n      <sc-for list=\"{{ ingredients }}\" as=\"ing\" hint-placeholder-count=\"8\">\n        <button onclick=\"{{ ing.toggle }}\" style=\"text-align:left;padding:0;border:1px solid {{ ing.bd }};background:var(--surface);border-radius:var(--rad);overflow:hidden;cursor:pointer;display:flex;flex-direction:column;transition:.35s;font-family:var(--fbody)\" style-hover=\"border-color:var(--gold)\">\n          <div style=\"position:relative;aspect-ratio:{{ ing.ar }};background:{{ ing.grad }};overflow:hidden;transition:.4s\">\n            <div style=\"position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--fdisp);font-size:54px;color:rgba(255,255,255,.22)\">{{ ing.initial }}<\u002Fdiv>\n            <img src=\"{{ ing.img }}\" alt=\"{{ ing.name }}\" style=\"position:absolute;inset:0;width:100%;height:100%;object-fit:cover\">\n            <div style=\"position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,rgba(15,10,4,.78))\">\n              <div style=\"font-family:var(--fdisp);font-size:23px;color:#fff;line-height:1.05\">{{ ing.name }}<\u002Fdiv>\n              <div style=\"font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.78);margin-top:3px\">{{ ing.family }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ ing.open }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"padding:18px 16px;border-top:1px solid var(--line)\">\n              <p style=\"font-size:13px;line-height:1.6;color:var(--muted);margin:0 0 12px\">{{ ing.character }}<\u002Fp>\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px\">\n                <span>Origen<\u002Fspan><span style=\"color:var(--ink)\">{{ ing.origin }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:7px\">\n                <span>Posición<\u002Fspan><span style=\"color:var(--gold)\">{{ ing.pos }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ ing.closed }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"padding:13px 16px;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gold)\">Descubrir +<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== NEWSLETTER ===================== -->\n  <section style=\"background:var(--ink);color:var(--bg);margin-top:60px\">\n    <div style=\"max-width:760px;margin:0 auto;padding:84px 30px;text-align:center\">\n      <div style=\"font-size:11.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);margin-bottom:18px\">La Carta de Aromia<\u002Fdiv>\n      <h2 style=\"font-family:var(--fdisp);font-weight:var(--disp-weight,600);font-size:clamp(32px,4vw,50px);line-height:1.06;margin:0 0 18px;color:var(--bg)\">Una fragancia, una historia, cada domingo.<\u002Fh2>\n      <p style=\"font-size:16px;line-height:1.7;color:color-mix(in srgb, var(--bg) 64%, transparent);max-width:480px;margin:0 auto 32px\">Reseñas honestas, ingredientes en profundidad y lanzamientos del Lab. Sin ruido, sin spam.<\u002Fp>\n      <form onsubmit=\"{{ noSubmit }}\" style=\"display:flex;gap:10px;max-width:440px;margin:0 auto\">\n        <input type=\"email\" placeholder=\"tu@correo.com\" style=\"flex:1;background:transparent;border:1px solid color-mix(in srgb, var(--bg) 30%, transparent);border-radius:var(--rad);padding:14px 16px;color:var(--bg);font-family:var(--fbody);font-size:14px;outline:none\">\n        <button type=\"submit\" style=\"background:var(--gold);color:#fff;font-family:var(--fbody);font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;border:none;border-radius:var(--rad);padding:14px 22px;cursor:pointer;white-space:nowrap;transition:.3s\" style-hover=\"background:#fff;color:var(--ink)\">Suscribirme<\u002Fbutton>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <!-- ===================== FOOTER ===================== -->\n  <footer style=\"border-top:1px solid var(--line);background:var(--bg)\">\n    <div style=\"max-width:1240px;margin:0 auto;padding:56px 30px 40px;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:36px\">\n      <div>\n        <div style=\"font-family:var(--fdisp);font-weight:700;font-size:24px;letter-spacing:.3em;padding-left:.3em\">AROMIA<\u002Fdiv>\n        <p style=\"font-size:13.5px;line-height:1.7;color:var(--muted);margin:16px 0 0;max-width:260px\">La plataforma de perfumería más respetada del mundo hispanohablante. Honestidad, educación y elegancia.<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:16px\">Ecosistema<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <a href=\"#tienda\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Magazine<\u002Fa>\n          <a href=\"#tienda\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Tienda<\u002Fa>\n          <a href=\"#estudio\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Lab<\u002Fa>\n          <a href=\"#academia\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Academia<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:16px\">Comunidad<\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:11px\">\n          <a href=\"#\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Club<\u002Fa>\n          <a href=\"#\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Aromia AI<\u002Fa>\n          <a href=\"#\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Reseñas<\u002Fa>\n          <a href=\"#\" style=\"font-size:13.5px;color:var(--muted);text-decoration:none;transition:.2s\" style-hover=\"color:var(--ink)\">Sobre Aromia<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div>\n        <div style=\"font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin-bottom:16px\">Valores<\u002Fdiv>\n        <div style=\"font-size:13px;line-height:1.9;color:var(--muted)\">Honestidad<br>Educación<br>Elegancia<br>Curiosidad<br>Excelencia<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"border-top:1px solid var(--line)\">\n      <div style=\"max-width:1240px;margin:0 auto;padding:20px 30px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted)\">\n        <span>© 2026 Aromia. La autoridad editorial que además vende. Este sitio contiene enlaces de afiliado; podemos recibir comisión por compras realizadas a través de ellos.<\u002Fspan>\n        <span>Hecho con honestidad · Madrid · Ciudad de México<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;initialStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;editorial&quot;,&quot;moderno&quot;],&quot;default&quot;:&quot;editorial&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estilo&quot;},&quot;initialMode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estilo&quot;},&quot;accentGold&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B08D4C&quot;,&quot;options&quot;:[&quot;#B08D4C&quot;,&quot;#BE7C46&quot;,&quot;#9C7BB0&quot;,&quot;#5E7E6B&quot;],&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Estilo&quot;}}\">\nclass Component extends DCLogic {\n  constructor(props){\n    super(props);\n    this.state = {\n      mode: props.initialMode || 'light',\n      sk: props.initialStyle || 'editorial',\n      tier: 'salida',\n      expanded: null,\n      userRating: 0,\n      hover: 0,\n      added: false\n    };\n    this.barRefs = [];\n  }\n\n  componentDidMount(){ \n    this.applyTheme();\n    this.hideBrokenImages();\n    this.io = new IntersectionObserver((es)=>{\n      es.forEach(e=>{ if(e.isIntersecting){ this.animate(); this.io.disconnect(); } });\n    }, { threshold: 0.2 });\n    if(this.vizRef) this.io.observe(this.vizRef);\n  }\n  componentDidUpdate(prev){\n    if(prev.initialMode!==this.props.initialMode){ this.setState({mode:this.props.initialMode}); }\n    if(prev.initialStyle!==this.props.initialStyle){ this.setState({sk:this.props.initialStyle}); }\n    if(prev.accentGold!==this.props.accentGold){ this.applyTheme(); }\n  }\n\n  hideBrokenImages(){\n    if(!this.rootRef) return;\n    const fix=(img)=>{ if(img.complete && img.naturalWidth===0) img.style.opacity=0; };\n    this.rootRef.querySelectorAll('img').forEach(img=>{\n      img.addEventListener('error',()=>{ img.style.opacity=0; });\n      img.addEventListener('load',()=>{ img.style.opacity=1; });\n      fix(img);\n    });\n    setTimeout(()=>{ if(this.rootRef) this.rootRef.querySelectorAll('img').forEach(fix); }, 2500);\n  }\n  animate(){\n    this.barRefs.forEach(el=>{ if(el) el.style.width = (el.dataset.val||0)+'%'; });\n    if(this.radarRef) this.radarRef.style.transform = 'scale(1)';\n    if(this.starRef) this.starRef.style.width = this.avgPct + '%';\n  }\n\n  themeVars(){\n    const dark = this.state.mode === 'dark';\n    const mod = this.state.sk === 'moderno';\n    const v = dark ? {\n      '--bg':'#0E0C0A','--surface':'#17120D','--surface2':'#1C1610','--ink':'#F2EBDD','--muted':'#A39A88',\n      '--line':'rgba(242,235,221,.13)','--gold-soft':'rgba(201,164,92,.16)'\n    } : {\n      '--bg':'#F6F2EA','--surface':'#FFFFFF','--surface2':'#FBF7F0','--ink':'#15120D','--muted':'#6E675B',\n      '--line':'rgba(21,18,13,.12)','--gold-soft':'rgba(176,141,76,.13)'\n    };\n    v['--gold'] = this.props.accentGold || (mod ? (dark?'#D08A4F':'#BE7C46') : (dark?'#C9A45C':'#B08D4C'));\n    v['--fdisp'] = mod ? \"'Syne',system-ui,sans-serif\" : \"'Cormorant Garamond',Georgia,serif\";\n    v['--fbody'] = \"'Jost',system-ui,sans-serif\";\n    v['--rad'] = mod ? '11px' : '2px';\n    v['--disp-spacing'] = mod ? '-0.02em' : '0.004em';\n    v['--disp-weight'] = mod ? '700' : '600';\n    return v;\n  }\n  applyTheme(){\n    if(!this.rootRef) return;\n    const v = this.themeVars();\n    for(const k in v) this.rootRef.style.setProperty(k, v[k]);\n  }\n\n  starsFor(r){ const full=Math.round(r); return '★★★★★'.slice(0,full)+'☆☆☆☆☆'.slice(0,5-full); }\n\n  renderVals(){\n    const st = this.state;\n    // theme controls\n    const modeIcon = st.mode==='light' ? '☾' : '☀';\n    const styleLabel = st.sk==='editorial' ? 'Editorial' : 'Moderno';\n\n    // ---- collection ----\n    const grads = ['linear-gradient(150deg,#cbb393,#7a5f3c)','linear-gradient(150deg,#cfd6c4,#6f8367)','linear-gradient(150deg,#cdc1d8,#6a5a7e)','linear-gradient(150deg,#bcc4c0,#586b62)','linear-gradient(150deg,#dcc0bd,#955a59)','linear-gradient(150deg,#daccb0,#9a7d52)'];\n    const imgs = [\n      'https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=800&q=70',\n      'https://images.unsplash.com/photo-1587017539504-67cfbddac569?auto=format&fit=crop&w=800&q=70',\n      'https://images.unsplash.com/photo-1615397587950-3cbb55f95b77?auto=format&fit=crop&w=800&q=70',\n      'https://images.unsplash.com/photo-1594035910387-fea47794261f?auto=format&fit=crop&w=800&q=70',\n      'https://images.unsplash.com/photo-1610461888750-10bfc601b874?auto=format&fit=crop&w=800&q=70',\n      'https://images.unsplash.com/photo-1523293182086-7651a899d37f?auto=format&fit=crop&w=800&q=70'\n    ];\n    const pdata = [\n      ['Ámbar Nómada','Ámbar amaderado','148 €','Aromia Lab','Élise Marchand','Bergamota, cardamomo, sándalo, ámbar',4.6],\n      ['Marea Cítrica','Cítrico aromático','120 €','Aromia Lab','Tomás Vidal','Bergamota, neroli, vetiver, sal',4.3],\n      ['Iris Nocturno','Floral polvoso','135 €','Aromia Lab','Élise Marchand','Iris, violeta, almizcle, haba tonka',4.7],\n      ['Madera de Lluvia','Amaderado verde','128 €','Aromia Lab','Koji Nara','Petricor, vetiver, cedro, musgo',4.4],\n      ['Rosa Insurgente','Floral especiado','142 €','Aromia Lab','Lucía Romero','Rosa, pimienta rosa, pachulí, oud',4.5],\n      ['Sal & Higo','Frutal salino','115 €','Aromia Lab','Tomás Vidal','Higo, sal marina, leche de higo, cedro',4.2]\n    ];\n    const perfumes = pdata.map((p,i)=>({\n      name:p[0], family:p[1], price:p[2], house:p[3], perfumer:p[4], notes:p[5],\n      rating:p[6].toFixed(1), starsStr:this.starsFor(p[6]),\n      grad:grads[i], img:imgs[i], initial:p[0][0]\n    }));\n\n    // ---- flagship gallery ----\n    const galleryUrls = [\n      'https://images.unsplash.com/photo-1592945403244-b3fbafd7f539?auto=format&fit=crop&w=900&q=70',\n      'https://images.unsplash.com/photo-1541643600914-78b084683601?auto=format&fit=crop&w=900&q=70',\n      'https://images.unsplash.com/photo-1588405748880-12d1d2a59f75?auto=format&fit=crop&w=900&q=70',\n      'https://images.unsplash.com/photo-1615397587950-3cbb55f95b77?auto=format&fit=crop&w=900&q=70'\n    ];\n    const g = st.gimg || 0;\n    const thumbs = galleryUrls.map((u,i)=>({\n      u, grad:'linear-gradient(150deg,#cbb393,#7a5f3c)',\n      border: i===g ? 'var(--gold)' : 'var(--line)',\n      click: ()=>this.setState({gimg:i})\n    }));\n\n    // ---- performance ----\n    const md = [['Longevidad',8.5,'Larga · 8–10 h en piel'],['Estela',7.0,'Moderada-alta · deja rastro'],['Proyección',7.5,'Notable la primera hora'],['Precio-valor',8.0,'Justo para su concentración']];\n    const metrics = md.map(m=>({k:m[0], d:m[2], pct:Math.round(m[1]*10)}));\n\n    // ---- radar ----\n    const ax = [['Especiado',9],['Amaderado',8],['Cálido',8.5],['Floral',5],['Cítrico',4],['Dulce',6]];\n    const cx=120, cy=120, R=78;\n    const pt=(i,r)=>{ const a=(-90+i*60)*Math.PI/180; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };\n    const radarPoints = ax.map((d,i)=>pt(i,R*d[1]/10).join(',')).join(' ');\n    const radarGrid = [1,0.66,0.33].map(f=>ax.map((d,i)=>pt(i,R*f).join(',')).join(' '));\n    const radarSpokes = ax.map((d,i)=>{ const p=pt(i,R); return {x1:cx,y1:cy,x2:p[0],y2:p[1]}; });\n    const radarLabels = ax.map((d,i)=>{ const p=pt(i,R+15); const dp=pt(i,R*d[1]/10); return {x:p[0], y:p[1]+3.5, dx:dp[0], dy:dp[1], name:d[0], anchor: p[0]>cx+4?'start':(p[0]<cx-4?'end':'middle')}; });\n\n    // ---- pyramid ----\n    const tiers = {\n      salida:{label:'Salida', time:'0 – 15 min', desc:'La primera impresión: volátil y luminosa. Dura poco, pero define el encuentro y abre la puerta a todo lo demás.', notes:['Bergamota','Cardamomo','Jengibre']},\n      corazon:{label:'Corazón', time:'15 min – 3 h', desc:'El alma de la fragancia. Emerge cuando la salida se desvanece y marca el carácter que recordarás.', notes:['Ylang Ylang','Iris','Azafrán']},\n      fondo:{label:'Fondo', time:'3 – 10 h +', desc:'La huella. Moléculas pesadas que fijan el perfume a la piel y construyen su estela durante horas.', notes:['Sándalo','Ámbar','Vainilla','Vetiver']}\n    };\n    const order=[['salida','56%'],['corazon','78%'],['fondo','100%']];\n    const bands = order.map(o=>{ const k=o[0]; const on=st.tier===k; return {\n      label:tiers[k].label, time:tiers[k].time, width:o[1],\n      bg: on?'var(--gold)':'transparent', fg: on?'#fff':'var(--ink)', bd: on?'var(--gold)':'var(--line)',\n      click:()=>this.setState({tier:k})\n    };});\n    const aTier = tiers[st.tier];\n\n    // ---- retailers (affiliate comparator) ----\n    const retailers = [\n      {name:'Notino', tag:'Envío 24–48h · devolución gratis', price:'128 €', url:'https://www.notino.es/'},\n      {name:'Druni', tag:'Recogida en tienda disponible', price:'134,90 €', url:'https://www.druni.es/'},\n      {name:'Sephora', tag:'Puntos de fidelidad Beauty Pass', price:'148 €', url:'https://www.sephora.es/'}\n    ];\n\n    // ---- rating ----\n    const avg=4.6; this.avgPct = avg/5*100;\n    const userStars = [1,2,3,4,5].map(i=>{ const lit = i <= (st.hover||st.userRating); return {\n      color: lit?'var(--gold)':'var(--line)', scale: i===st.hover?'scale(1.18)':'scale(1)',\n      enter:()=>this.setState({hover:i}), click:()=>this.setState({userRating:i})\n    };});\n    const ratingMsg = st.userRating ? ['','«No es para mí»','«Correcto»','«Me gusta»','«Excelente»','«Una obra»'][st.userRating] : 'Pasa el cursor y elige';\n\n    // ---- lessons ----\n    const lessons = [\n      {num:'01', title:'La pirámide', body:'Un perfume no huele igual al minuto que a las cuatro horas. Se despliega en tres pisos —salida, corazón y fondo— que aparecen y se relevan con el tiempo.', tip:'Lee siempre el fondo: es lo que de verdad llevarás puesto.'},\n      {num:'02', title:'La longevidad', body:'Es cuántas horas permanece detectable sobre tu piel. Depende de la concentración, los ingredientes de fondo y tu propia química cutánea.', tip:'EDP > EDT. La piel hidratada retiene mejor el aroma.'},\n      {num:'03', title:'Estela y proyección', body:'La proyección es la burbuja que te rodea; la estela, el rastro que dejas al pasar. Una bestia silenciosa proyecta poco pero deja huella.', tip:'Más no es mejor: 2 pulverizaciones bien puestas bastan.'}\n    ];\n\n    // ---- ingredients ----\n    const idata = [\n      ['Bergamota','Cítrica','Calabria, Italia','Chispeante y soleada, con un filo ligeramente amargo. La apertura más luminosa de la perfumería.','Salida','linear-gradient(150deg,#e7d98a,#b89a2e)','https://images.unsplash.com/photo-1557800636-894a64c1696f?auto=format&fit=crop&w=600&q=70'],\n      ['Cardamomo','Especiada','Guatemala · India','Fresco y especiado a la vez, verde y aromático. Aporta una sofisticación cálida e inesperada.','Salida','linear-gradient(150deg,#cdd6a8,#7d8a4e)','https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=600&q=70'],\n      ['Jengibre','Especiada','Costa de Marfil','Picante, efervescente y terroso. Una corriente eléctrica que despierta la composición.','Salida','linear-gradient(150deg,#e8c79a,#bd7f3c)','https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&w=600&q=70'],\n      ['Ylang Ylang','Floral','Comoras · Madagascar','Floral cremoso y exótico, con un guiño a plátano maduro. Sensual y solar.','Corazón','linear-gradient(150deg,#f0df9c,#c9a93e)','https://images.unsplash.com/photo-1490750967868-88aa4486c946?auto=format&fit=crop&w=600&q=70'],\n      ['Iris','Floral polvosa','Florencia, Italia','Polvoso, mantecoso y aristocrático. Uno de los materiales más caros y elegantes que existen.','Corazón','linear-gradient(150deg,#cfc6dd,#7d6f97)','https://images.unsplash.com/photo-1496062031456-07b8f162a322?auto=format&fit=crop&w=600&q=70'],\n      ['Azafrán','Especiada','Irán · La Mancha','Cuero suave, ámbar y un dulzor amargo. Profundidad y un aire oriental inconfundible.','Corazón','linear-gradient(150deg,#e6a76a,#a8521f)','https://images.unsplash.com/photo-1509358271058-acd22cc93898?auto=format&fit=crop&w=600&q=70'],\n      ['Sándalo','Amaderada','Mysore · Australia','Lácteo, cálido y balsámico. La madera más cremosa y reconfortante de la perfumería.','Fondo','linear-gradient(150deg,#d8c19a,#8a6a40)','https://images.unsplash.com/photo-1503424886307-b090341d25d1?auto=format&fit=crop&w=600&q=70'],\n      ['Vainilla','Gourmand','Madagascar','Dulce, balsámica y envolvente. El abrazo final que redondea cualquier fondo cálido.','Fondo','linear-gradient(150deg,#e3cba2,#9c7544)','https://images.unsplash.com/photo-1631206753348-db44968fd440?auto=format&fit=crop&w=600&q=70']\n    ];\n    const ingredients = idata.map((d,i)=>{ const open=st.expanded===i; return {\n      name:d[0], family:d[1], origin:d[2], character:d[3], pos:d[4], grad:d[5], img:d[6], initial:d[0][0],\n      open, closed:!open, ar: open?'4/3':'4/5', bd: open?'var(--gold)':'var(--line)',\n      toggle:()=>this.setState({expanded: open?null:i})\n    };});\n\n    const noSubmit = (e)=>{ e.preventDefault(); };\n\n    return {\n      setRoot:(el)=>{ if(el){ this.rootRef=el; } },\n      setViz:(el)=>{ if(el) this.vizRef=el; },\n      setRadar:(el)=>{ if(el) this.radarRef=el; },\n      setStarFill:(el)=>{ if(el) this.starRef=el; },\n      collectBar:(el)=>{ if(el && !this.barRefs.includes(el)) this.barRefs.push(el); },\n      modeIcon, styleLabel, toggleMode:()=>this.setState({mode:this.state.mode==='light'?'dark':'light'}, ()=>this.applyTheme()),\n      toggleStyle:()=>this.setState({sk:this.state.sk==='editorial'?'moderno':'editorial'}, ()=>this.applyTheme()),\n      imgErr:(e)=>{ e.target.style.opacity=0; },\n      perfumes,\n      mainImg: galleryUrls[g], thumbs,\n      metrics,\n      radarPoints, radarGrid, radarSpokes, radarLabels,\n      bands, aTier, retailers,\n      avgStr: avg.toFixed(1), votes:'1.284', userStars, starsLeave:()=>this.setState({hover:0}), ratingMsg,\n      noSubmit,\n      lessons, ingredients\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
