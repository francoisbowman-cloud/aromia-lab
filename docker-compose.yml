version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aromia
      POSTGRES_PASSWORD: aromia
      POSTGRES_DB: aromia
    ports:
      - "5432:5432"
    volumes:
      - aromia_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ./apps/api
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://aromia:aromia@postgres:5432/aromia
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost:3000

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000

volumes:
  aromia_postgres_data:
