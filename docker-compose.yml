version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: aromia
      POSTGRES_PASSWORD: aromia
      POSTGRES_DB: aromia
    ports:
      - "5432:5432"
    volumes:
      - aromia_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  aromia_postgres_data:
