name: Web Product Final Gate

on:
  pull_request:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start mock API
        run: |
          cat > /tmp/aromia-web-product-api.mjs <<'EOF'
          import http from 'node:http';
          const perfume={id:1,slug:'baccarat-rouge-540',nombre:'Baccarat Rouge 540',marca:'Maison Francis Kurkdjian',genero:'unisex',familia_olfativa:'Ámbar floral',precio_referencia:325,moneda:'USD',categoria_precio:'lujo',imagen_url:null,link_afiliado:null};
          const article={id:10,slug:'materia-y-memoria',titulo:'Materia y memoria: por qué un perfume permanece',categoria:'analisis',contenido_html:'<p>El perfume existe entre materia, memoria y presencia. Esta lectura conecta la experiencia sensorial con los objetos que la vuelven concreta.</p><h2>La materia invisible</h2><p>Una composición se reconoce por contraste, textura y evolución.</p>',imagen_portada_url:null,autor:'Aromia Editorial',meta_title:'Materia y memoria en perfumería',meta_description:'Una lectura editorial sobre materia, memoria y perfume.',perfumes_relacionados:[1],publicado_en:'2026-08-09T12:00:00Z'};
          http.createServer((req,res)=>{res.setHeader('Content-Type','application/json');if(req.url==='/api/perfumes')return res.end(JSON.stringify([perfume]));if(req.url==='/api/articulos')return res.end(JSON.stringify([article]));if(req.url==='/api/articulos/materia-y-memoria')return res.end(JSON.stringify(article));if(req.url==='/api/perfumes/baccarat-rouge-540')return res.end(JSON.stringify({...perfume,retailers:[]}));if(req.method==='POST'&&req.url==='/api/subscribers'){res.statusCode=201;return res.end('{}');}res.statusCode=404;res.end('{}');}).listen(4000,'127.0.0.1');
          EOF
          node /tmp/aromia-web-product-api.mjs >/tmp/web-product-api.log 2>&1 &
      - name: Start web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/web-product-web.log 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:3000/club >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/web-product-web.log; exit 1
      - name: Capture surfaces
        run: |
          mkdir -p web-product-gate
          cat > web-product-gate/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const [mode,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const [name,path] of [['club','/club'],['article','/magazine/materia-y-memoria']]){
              const page=await browser.newPage({viewport});
              await page.goto(`http://127.0.0.1:3000${path}`,{waitUntil:'networkidle'});
              await page.screenshot({path:`web-product-gate/${name}-${mode}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          EOF
          node web-product-gate/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-product-final-gate
          path: apps/web/web-product-gate
          retention-days: 7
