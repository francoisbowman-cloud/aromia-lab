name: Catalog White Background Apply

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  apply-validated-images:
    if: github.head_ref == 'feat/catalog-white-canvas-image-normalization'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      API_URL: https://api-production-fe2f.up.railway.app
      ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install image validator
        run: |
          mkdir -p /tmp/aromia-white-apply
          cd /tmp/aromia-white-apply
          npm init -y >/dev/null 2>&1
          npm install sharp@0.33.5 >/dev/null
      - name: Validate all replacements, apply atomically by gate, and verify full catalog
        shell: bash
        run: |
          test -n "$ADMIN_API_TOKEN" || { echo 'ADMIN_API_TOKEN secret is required'; exit 1; }
          cp catalog/reports/catalog-white-background-replacements.json /tmp/aromia-white-apply/replacements.json
          cd /tmp/aromia-white-apply
          cat > apply.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';

          const API=process.env.API_URL;
          const TOKEN=process.env.ADMIN_API_TOKEN;
          const payload=JSON.parse(await fs.readFile('replacements.json','utf8'));
          const edge=(pixels,width,height,channels)=>{const out=[];const push=(x,y)=>{const i=(y*width+x)*channels;out.push([pixels[i]??0,pixels[i+1]??0,pixels[i+2]??0])};const sx=Math.max(1,Math.floor(width/32)),sy=Math.max(1,Math.floor(height/32));for(let x=0;x<width;x+=sx){push(x,0);push(x,height-1)}for(let y=0;y<height;y+=sy){push(0,y);push(width-1,y)}return out};
          const nearWhite=([r,g,b])=>Math.min(r,g,b)>=238&&Math.max(r,g,b)-Math.min(r,g,b)<=22;
          async function whiteRatio(url){const response=await fetch(url,{headers:{'user-agent':'Mozilla/5.0 AromiaCatalogAudit/1.0'}});if(!response.ok)throw new Error(`HTTP ${response.status} ${url}`);const input=Buffer.from(await response.arrayBuffer());const {data,info}=await sharp(input).rotate().resize({width:900,height:900,fit:'inside',withoutEnlargement:true}).removeAlpha().raw().toBuffer({resolveWithObject:true});const samples=edge(data,info.width,info.height,info.channels);return samples.filter(nearWhite).length/Math.max(1,samples.length)}

          // Gate first: no production write until every proposed image passes.
          const preflight=[];
          for(const item of payload.candidates){const ratio=await whiteRatio(item.url);preflight.push({slug:item.slug,ratio:Number(ratio.toFixed(3)),url:item.url});if(ratio<.92)throw new Error(`Preflight rejected ${item.slug}: whiteEdgeRatio=${ratio.toFixed(3)}`)}

          const perfumesResponse=await fetch(`${API}/api/perfumes`);
          if(!perfumesResponse.ok)throw new Error(`Perfume API HTTP ${perfumesResponse.status}`);
          const perfumes=await perfumesResponse.json();
          const bySlug=new Map(perfumes.map(p=>[p.slug,p]));
          const missing=payload.candidates.filter(x=>!bySlug.has(x.slug)).map(x=>x.slug);
          if(missing.length)throw new Error(`Missing catalog slugs: ${missing.join(', ')}`);

          const applied=[];
          for(const item of payload.candidates){
            const perfume=bySlug.get(item.slug);
            const response=await fetch(`${API}/api/admin/perfumes/${perfume.id}`,{method:'PATCH',headers:{authorization:`Bearer ${TOKEN}`,'content-type':'application/json'},body:JSON.stringify({imagen_url:item.url})});
            if(!response.ok)throw new Error(`PATCH ${item.slug} failed HTTP ${response.status}: ${await response.text()}`);
            applied.push({slug:item.slug,id:perfume.id,url:item.url});
          }

          // Verify every one of the 125 records after mutation.
          const refreshedResponse=await fetch(`${API}/api/perfumes`,{cache:'no-store'});
          if(!refreshedResponse.ok)throw new Error(`Post-apply API HTTP ${refreshedResponse.status}`);
          const refreshed=await refreshedResponse.json();
          const report=[];
          for(const perfume of refreshed){
            if(!perfume.imagen_url){report.push({slug:perfume.slug,status:'MISSING_IMAGE',ratio:0});continue}
            try{const ratio=await whiteRatio(perfume.imagen_url);report.push({slug:perfume.slug,status:ratio>=.92?'PASS':'FAIL',ratio:Number(ratio.toFixed(3)),url:perfume.imagen_url})}
            catch(error){report.push({slug:perfume.slug,status:'ERROR',ratio:0,url:perfume.imagen_url,error:String(error)})}
          }
          const summary={total:report.length,pass:report.filter(x=>x.status==='PASS').length,fail:report.filter(x=>x.status!=='PASS').length,applied:applied.length};
          await fs.mkdir('artifacts',{recursive:true});
          await fs.writeFile('artifacts/catalog-white-background-apply.json',JSON.stringify({summary,preflight,applied,report},null,2));
          console.log(JSON.stringify(summary,null,2));
          for(const item of report.filter(x=>x.status!=='PASS'))console.log(`${item.status}\t${item.ratio}\t${item.slug}\t${item.url??''}`);
          if(summary.total!==125||summary.fail!==0)process.exitCode=1;
          NODE
          node apply.mjs
      - name: Upload one-pass normalization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-white-background-apply
          path: /tmp/aromia-white-apply/artifacts
          retention-days: 30
