name: OMNI Foundational Perceptual Evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  perceptual-evidence:
    if: startsWith(github.head_ref, 'omni/foundational-purpose-')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      API_URL: https://api-production-fe2f.up.railway.app
      NEXT_PUBLIC_API_URL: https://api-production-fe2f.up.railway.app
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout AFTER
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout BEFORE worktree
        shell: bash
        run: git worktree add /tmp/aromia-before "$BASE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        shell: bash
        run: |
          npm ci --prefix apps/web
          npm ci --prefix /tmp/aromia-before/apps/web

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/omni-perceptual
          cd /tmp/omni-perceptual
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start BEFORE and AFTER
        shell: bash
        run: |
          cd /tmp/aromia-before/apps/web
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3001 > /tmp/aromia-perceptual-before.log 2>&1 &
          cd "$GITHUB_WORKSPACE/apps/web"
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3002 > /tmp/aromia-perceptual-after.log 2>&1 &
          for port in 3001 3002; do
            ready=0
            for i in {1..90}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "App on port ${port} did not start"
              exit 1
            fi
          done

      - name: Render fully-warmed visual evidence
        shell: bash
        run: |
          cd /tmp/omni-perceptual
          mkdir -p artifacts
          cat > perceptual.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const origins = { before: 'http://127.0.0.1:3001', after: 'http://127.0.0.1:3002' };
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 },
          ];
          const staticRoutes = ['/', '/catalogo', '/descubrir'];

          async function resolvePdpSlug() {
            try {
              const response = await fetch(process.env.API_URL + '/api/perfumes');
              if (!response.ok) return null;
              const rows = await response.json();
              return Array.isArray(rows) ? rows.find((p) => p && p.slug)?.slug ?? null : null;
            } catch { return null; }
          }

          function safeName(route) {
            return route === '/' ? 'home' : route.replace(/^\//, '').replace(/[^a-z0-9-]+/gi, '-');
          }

          async function warmPage(page) {
            const viewportHeight = await page.evaluate(() => window.innerHeight);
            const pageHeight = await page.evaluate(() => document.documentElement.scrollHeight);
            const step = Math.max(320, Math.floor(viewportHeight * 0.72));
            for (let y = 0; y < pageHeight; y += step) {
              await page.evaluate((top) => window.scrollTo({ top, behavior: 'instant' }), y);
              await page.waitForTimeout(220);
            }
            await page.evaluate(() => window.scrollTo({ top: document.documentElement.scrollHeight, behavior: 'instant' }));
            await page.waitForTimeout(500);
            await page.evaluate(() => window.scrollTo({ top: 0, behavior: 'instant' }));
            await page.waitForTimeout(500);
            await page.evaluate(async () => {
              const imgs = Array.from(document.images);
              await Promise.all(imgs.map((img) => {
                if (img.complete) return Promise.resolve();
                return new Promise((resolve) => {
                  const done = () => resolve();
                  img.addEventListener('load', done, { once: true });
                  img.addEventListener('error', done, { once: true });
                  setTimeout(done, 3000);
                });
              }));
            });
          }

          async function inspect(browser, label, origin, route, viewport) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
            const consoleErrors = [];
            const pageErrors = [];
            const imageResponses = [];
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', (e) => pageErrors.push(String(e.message || e)));
            page.on('response', async (response) => {
              if (!response.url().includes('/api/catalog-image/')) return;
              const headers = response.headers();
              imageResponses.push({
                url: response.url(),
                status: response.status(),
                origin: headers['x-aromia-image-origin'] || null,
                contentType: headers['content-type'] || '',
              });
            });

            const response = await page.goto(`${origin}${route}`, { waitUntil: 'networkidle', timeout: 60000 });
            await warmPage(page);

            const metrics = await page.evaluate(() => {
              const images = Array.from(document.images);
              const productImages = images.filter((img) => (img.currentSrc || img.src).includes('/api/catalog-image/'));
              const loadedButInvisible = productImages.filter((img) => {
                if (!(img.complete && img.naturalWidth > 0)) return false;
                const s = getComputedStyle(img);
                const r = img.getBoundingClientRect();
                return s.visibility === 'hidden' || s.display === 'none' || Number(s.opacity) < 0.99 || r.width < 2 || r.height < 2;
              });
              return {
                overflowX: Math.max(0, document.documentElement.scrollWidth - window.innerWidth),
                h1Count: document.querySelectorAll('h1').length,
                totalImages: images.length,
                brokenImages: images.filter((img) => img.complete && img.naturalWidth === 0).length,
                productImages: productImages.length,
                loadedProductImages: productImages.filter((img) => img.complete && img.naturalWidth > 0).length,
                loadedButInvisible: loadedButInvisible.length,
                loadedButInvisibleAlt: loadedButInvisible.map((img) => img.alt || '').slice(0, 10),
              };
            });

            metrics.status = response?.status() ?? 0;
            metrics.consoleErrors = consoleErrors.length;
            metrics.pageErrors = pageErrors.length;
            metrics.imageResponses = imageResponses;
            metrics.realImageResponses = imageResponses.filter((item) => item.status < 400 && item.origin && item.origin !== 'placeholder').length;
            metrics.placeholderResponses = imageResponses.filter((item) => item.status < 400 && item.origin === 'placeholder').length;
            metrics.failedImageResponses = imageResponses.filter((item) => item.status >= 400).length;

            await page.screenshot({ path: `artifacts/${label}-${safeName(route)}-${viewport.name}.png`, fullPage: true });
            await page.close();
            return metrics;
          }

          (async () => {
            const slug = await resolvePdpSlug();
            const routes = [...staticRoutes, ...(slug ? [`/catalogo/${slug}`] : [])];
            const browser = await chromium.launch({ headless: true });
            const report = { baseSha: process.env.BASE_SHA, routes, viewports, before: {}, after: {}, acceptance: [] };

            for (const viewport of viewports) {
              for (const route of routes) {
                const key = `${viewport.name}:${route}`;
                const before = await inspect(browser, 'before', origins.before, route, viewport);
                const after = await inspect(browser, 'after', origins.after, route, viewport);
                report.before[key] = before;
                report.after[key] = after;

                const failures = [];
                if (after.status >= 400 || after.status === 0) failures.push(`HTTP ${after.status}`);
                if (after.overflowX > 2) failures.push(`horizontal overflow ${after.overflowX}px`);
                if (after.h1Count !== 1) failures.push(`expected one h1, found ${after.h1Count}`);
                if (after.pageErrors > 0) failures.push(`${after.pageErrors} page errors`);
                if (after.consoleErrors > before.consoleErrors) failures.push(`console errors ${before.consoleErrors}->${after.consoleErrors}`);
                if (after.brokenImages > before.brokenImages) failures.push(`broken images ${before.brokenImages}->${after.brokenImages}`);
                if (after.loadedButInvisible > 0) failures.push(`${after.loadedButInvisible} loaded product images remain visually hidden`);
                if (after.failedImageResponses > 0) failures.push(`${after.failedImageResponses} catalog-image responses failed after warm scroll`);
                if (after.realImageResponses < before.realImageResponses) failures.push(`real product image responses regressed ${before.realImageResponses}->${after.realImageResponses}`);

                report.acceptance.push({ key, accepted: failures.length === 0, failures });
              }
            }

            await browser.close();
            const failures = report.acceptance.filter((item) => !item.accepted);
            fs.writeFileSync('artifacts/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify({ checks: report.acceptance.length, failures: failures.length, failureDetails: failures }, null, 2));
            if (failures.length) process.exit(1);
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          API_URL="$API_URL" BASE_SHA="$BASE_SHA" node perceptual.cjs

      - name: Upload warmed perceptual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-foundational-perceptual-evidence
          path: /tmp/omni-perceptual/artifacts
          retention-days: 30

      - name: Print logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- BEFORE ---'
          tail -n 180 /tmp/aromia-perceptual-before.log || true
          echo '--- AFTER ---'
          tail -n 180 /tmp/aromia-perceptual-after.log || true
