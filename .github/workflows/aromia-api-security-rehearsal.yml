# Disposable API lockfile-only fix rehearsal. No repository or production writes.
name: Aromia API dependency remediation rehearsal
on:
  pull_request:
    paths:
      - '.github/workflows/aromia-api-security-rehearsal.yml'
      - 'apps/api/package.json'
      - 'apps/api/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  safe-api-lockfile-upgrade:
    name: API semver-safe lockfile update and PostgreSQL test
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aromia
          POSTGRES_PASSWORD: aromia
          POSTGRES_DB: aromia_intelligence_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U aromia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Apply compatible fixes to disposable API lockfile, no force
        run: |
          cd apps/api
          set +e
          npm audit fix --package-lock-only --no-fund
          fix_exit=$?
          set -e
          echo "audit_fix_exit=$fix_exit; continuing to validate resulting lockfile"
      - run: npm ci --prefix apps/api
      - run: npm --prefix apps/api run build
      - run: npm --prefix apps/api run test:intelligence
        env:
          INTELLIGENCE_TEST_DATABASE_URL: postgresql://aromia:aromia@127.0.0.1:5432/aromia_intelligence_test
      - name: Re-audit API production dependencies
        run: |
          cd apps/api
          set +e
          npm audit --json --omit=dev > "$RUNNER_TEMP/aromia-api-remediated-audit.json"
          set -e
          node ../../scripts/qa/summarize-dependency-audit.mjs "$RUNNER_TEMP/aromia-api-remediated-audit.json" report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aromia-api-safe-lockfile-rehearsal
          path: |
            apps/api/package.json
            apps/api/package-lock.json
          retention-days: 7
