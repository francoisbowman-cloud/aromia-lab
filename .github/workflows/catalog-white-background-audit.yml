name: Catalog White Background Audit

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit-white-backgrounds:
    if: github.head_ref == 'feat/catalog-white-canvas-image-normalization'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install audit dependencies
        run: |
          mkdir -p /tmp/aromia-white-audit
          cd /tmp/aromia-white-audit
          npm init -y >/dev/null 2>&1
          npm install sharp@0.33.5 >/dev/null
      - name: Audit projected post-migration catalog state
        shell: bash
        run: |
          cp catalog/reports/catalog-white-background-replacements.json /tmp/aromia-white-audit/replacements.json
          cd /tmp/aromia-white-audit
          cat > audit.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import sharp from 'sharp';

          const API='https://api-production-fe2f.up.railway.app';
          const payload=JSON.parse(await fs.readFile('replacements.json','utf8'));
          const replacementBySlug=new Map(payload.candidates.map(item=>[item.slug,item.url]));
          const perfumesResponse=await fetch(`${API}/api/perfumes`);
          if(!perfumesResponse.ok)throw new Error(`Perfume API HTTP ${perfumesResponse.status}`);
          const perfumes=await perfumesResponse.json();
          const edge=(pixels,width,height,channels)=>{const out=[];const push=(x,y)=>{const i=(y*width+x)*channels;out.push([pixels[i]??0,pixels[i+1]??0,pixels[i+2]??0])};const sx=Math.max(1,Math.floor(width/32)),sy=Math.max(1,Math.floor(height/32));for(let x=0;x<width;x+=sx){push(x,0);push(x,height-1)}for(let y=0;y<height;y+=sy){push(0,y);push(width-1,y)}return out};
          const nearWhite=([r,g,b])=>Math.min(r,g,b)>=238&&Math.max(r,g,b)-Math.min(r,g,b)<=22;
          const report=[];
          for(const perfume of perfumes){
            const imageUrl=replacementBySlug.get(perfume.slug)??perfume.imagen_url;
            const source=replacementBySlug.has(perfume.slug)?'replacement-manifest':'production-current';
            if(!imageUrl){report.push({slug:perfume.slug,status:'MISSING_IMAGE',ratio:0,source});continue}
            try{
              const response=await fetch(imageUrl,{headers:{'user-agent':'Mozilla/5.0 AromiaCatalogAudit/1.0'}});
              if(!response.ok){report.push({slug:perfume.slug,status:`HTTP_${response.status}`,ratio:0,imageUrl,source});continue}
              const input=Buffer.from(await response.arrayBuffer());
              const {data,info}=await sharp(input).rotate().resize({width:900,height:900,fit:'inside',withoutEnlargement:true}).removeAlpha().raw().toBuffer({resolveWithObject:true});
              const samples=edge(data,info.width,info.height,info.channels);
              const ratio=samples.filter(nearWhite).length/Math.max(1,samples.length);
              report.push({slug:perfume.slug,status:ratio>=.92?'PASS':'FAIL',ratio:Number(ratio.toFixed(3)),imageUrl,source});
            }catch(error){report.push({slug:perfume.slug,status:'ERROR',ratio:0,imageUrl,source,error:String(error)})}
          }
          const summary={total:report.length,pass:report.filter(x=>x.status==='PASS').length,fail:report.filter(x=>x.status!=='PASS').length,replacements:report.filter(x=>x.source==='replacement-manifest').length};
          await fs.mkdir('artifacts',{recursive:true});
          await fs.writeFile('artifacts/catalog-white-background-report.json',JSON.stringify({summary,report},null,2));
          console.log(JSON.stringify(summary,null,2));
          for(const item of report.filter(x=>x.status!=='PASS'))console.log(`${item.status}\t${item.ratio}\t${item.slug}\t${item.imageUrl??''}`);
          if(summary.total!==125||summary.fail!==0||summary.replacements!==25)process.exitCode=1;
          NODE
          node audit.mjs
      - name: Upload audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-white-background-audit
          path: /tmp/aromia-white-audit/artifacts
          retention-days: 30
