name: OMNI Fronts Integration Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration-proof:
    if: github.head_ref == 'agent/omni-fronts-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VISUAL_BASELINE_SHA: bfc63b6de56bff40cc8de6b20ea33f572dd6fdc3
      API_URL: https://api-production-fe2f.up.railway.app
      NEXT_PUBLIC_API_URL: https://api-production-fe2f.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout proven visual baseline
        run: git worktree add /tmp/aromia-visual-baseline "$VISUAL_BASELINE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix /tmp/aromia-visual-baseline/apps/web
      - name: Install Playwright
        run: |
          mkdir -p /tmp/omni-fronts
          cd /tmp/omni-fronts
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start baseline and integration
        run: |
          cd /tmp/aromia-visual-baseline/apps/web
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3001 > /tmp/aromia-baseline.log 2>&1 &
          cd "$GITHUB_WORKSPACE/apps/web"
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3002 > /tmp/aromia-integration.log 2>&1 &
          for port in 3001 3002; do
            ready=0
            for i in {1..90}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then exit 1; fi
          done
      - name: Compare integrated journeys
        run: |
          cd /tmp/omni-fronts
          mkdir -p artifacts
          cat > gate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          async function firstPerfumerSlug(origin) {
            const html = await (await fetch(`${origin}/perfumistas`)).text();
            return html.match(/href=["']\/perfumistas\/([a-z0-9-]+)["']/i)?.[1] || 'francis-kurkdjian';
          }

          async function inspect(browser, origin, route, viewport, label) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
            const pageErrors = [];
            page.on('pageerror', e => pageErrors.push(String(e.message || e)));
            const response = await page.goto(`${origin}${route}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(300);
            const metrics = await page.evaluate(() => {
              const visible = el => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
              };
              const text = Array.from(document.querySelectorAll('main *')).filter(visible).filter(el => (el.textContent || '').trim() && el.children.length === 0);
              const interactives = Array.from(document.querySelectorAll('a,button,input,select,summary')).filter(visible);
              return {
                overflowX: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                h1Count: document.querySelectorAll('h1').length,
                brokenImages: Array.from(document.images).filter(img => visible(img) && img.complete && img.naturalWidth === 0).length,
                textBelow12: text.filter(el => parseFloat(getComputedStyle(el).fontSize) < 12).length,
                undersizedTargets: interactives.filter(el => { const r = el.getBoundingClientRect(); return r.width < 44 || r.height < 44; }).length,
              };
            });
            await page.screenshot({ path: `artifacts/${label}-${viewport.name}-${route.replace(/[^a-z0-9]+/gi,'-')}.png`, fullPage: true });
            await page.close();
            return { status: response?.status() || 0, pageErrors: pageErrors.length, ...metrics };
          }

          (async () => {
            const origins = { baseline:'http://127.0.0.1:3001', integration:'http://127.0.0.1:3002' };
            const perfumer = await firstPerfumerSlug(origins.integration);
            const routes = ['/descubrir', '/quiz', `/perfumistas/${perfumer}`, '/catalogo/acqua-di-gio-edt'];
            const viewports = [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}];
            const browser = await chromium.launch({ headless: true });
            const report = { baselineSha: process.env.VISUAL_BASELINE_SHA, routes, checks: [] };

            for (const viewport of viewports) {
              for (const route of routes) {
                const before = await inspect(browser, origins.baseline, route, viewport, 'baseline');
                const after = await inspect(browser, origins.integration, route, viewport, 'integration');
                report.checks.push({ viewport: viewport.name, route, before, after, delta: { textBelow12: after.textBelow12-before.textBelow12, undersizedTargets: after.undersizedTargets-before.undersizedTargets } });
              }
            }
            const image = await fetch(`${origins.integration}/api/catalog-image/acqua-di-gio-edt`);
            report.acquaImage = { status:image.status, contentType:image.headers.get('content-type'), origin:image.headers.get('x-aromia-image-origin') };
            await browser.close();
            fs.writeFileSync('artifacts/report.json', JSON.stringify(report, null, 2));

            const failures = report.checks.filter(({before,after}) => after.status >= 400 || after.status === 0 || after.pageErrors > before.pageErrors || after.overflowX > Math.max(2,before.overflowX) || after.h1Count !== 1 || after.brokenImages > before.brokenImages || after.textBelow12 > before.textBelow12 || after.undersizedTargets > before.undersizedTargets);
            if (!image.ok || !(report.acquaImage.contentType || '').startsWith('image/')) failures.push({route:'acqua-image',after:report.acquaImage});
            console.log(JSON.stringify({ checks: report.checks.length, failures: failures.length, acquaImage: report.acquaImage }, null, 2));
            if (failures.length) { console.error(JSON.stringify(failures, null, 2)); process.exit(1); }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          VISUAL_BASELINE_SHA="$VISUAL_BASELINE_SHA" node gate.cjs
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-fronts-integration-evidence
          path: /tmp/omni-fronts/artifacts
          retention-days: 14
      - name: Print logs on failure
        if: failure()
        run: |
          tail -n 160 /tmp/aromia-baseline.log || true
          tail -n 160 /tmp/aromia-integration.log || true
