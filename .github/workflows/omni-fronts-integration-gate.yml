name: OMNI Fronts Integration Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  integration-proof:
    if: github.head_ref == 'agent/omni-fronts-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_URL: https://api-production-fe2f.up.railway.app
      NEXT_PUBLIC_API_URL: https://api-production-fe2f.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Install Playwright
        run: |
          mkdir -p /tmp/omni-fronts
          cd /tmp/omni-fronts
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start integrated Aromia
        run: |
          cd apps/web
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3002 > /tmp/aromia-fronts.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3002/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aromia-fronts.log
          exit 1
      - name: Verify integrated journeys
        run: |
          cd /tmp/omni-fronts
          mkdir -p artifacts
          cat > gate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          async function firstPerfumerSlug() {
            const html = await (await fetch('http://127.0.0.1:3002/perfumistas')).text();
            return html.match(/\/perfumistas\/([a-z0-9-]+)/)?.[1] || 'francis-kurkdjian';
          }

          (async () => {
            const perfumer = await firstPerfumerSlug();
            const routes = ['/descubrir', '/quiz', `/perfumistas/${perfumer}`, '/catalogo/acqua-di-gio-edt'];
            const viewports = [{name:'mobile',width:390,height:844},{name:'desktop',width:1440,height:1000}];
            const browser = await chromium.launch({ headless: true });
            const report = { routes, viewports, checks: [] };

            for (const viewport of viewports) {
              for (const route of routes) {
                const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
                const pageErrors = [];
                page.on('pageerror', e => pageErrors.push(String(e.message || e)));
                const response = await page.goto(`http://127.0.0.1:3002${route}`, { waitUntil: 'networkidle', timeout: 60000 });
                await page.waitForTimeout(300);
                const metrics = await page.evaluate(() => {
                  const visible = el => {
                    const r = el.getBoundingClientRect();
                    const s = getComputedStyle(el);
                    return r.width > 0 && r.height > 0 && s.display !== 'none' && s.visibility !== 'hidden';
                  };
                  const text = Array.from(document.querySelectorAll('main *')).filter(visible).filter(el => (el.textContent || '').trim() && el.children.length === 0);
                  return {
                    overflowX: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                    h1Count: document.querySelectorAll('h1').length,
                    brokenImages: Array.from(document.images).filter(img => visible(img) && img.complete && img.naturalWidth === 0).length,
                    textBelow12: text.filter(el => parseFloat(getComputedStyle(el).fontSize) < 12).length,
                  };
                });
                const check = { viewport: viewport.name, route, status: response?.status() || 0, pageErrors: pageErrors.length, ...metrics };
                report.checks.push(check);
                await page.screenshot({ path: `artifacts/${viewport.name}-${route.replace(/[^a-z0-9]+/gi,'-') || 'home'}.png`, fullPage: true });
                await page.close();
              }
            }

            const image = await fetch('http://127.0.0.1:3002/api/catalog-image/acqua-di-gio-edt');
            report.acquaImage = { status: image.status, contentType: image.headers.get('content-type'), origin: image.headers.get('x-aromia-image-origin') };
            await browser.close();
            fs.writeFileSync('artifacts/report.json', JSON.stringify(report, null, 2));

            const failures = report.checks.filter(c => c.status >= 400 || c.status === 0 || c.pageErrors || c.overflowX > 2 || c.h1Count !== 1 || c.brokenImages || c.textBelow12 > 0);
            if (!image.ok || !(report.acquaImage.contentType || '').startsWith('image/')) failures.push({ route: 'acqua-image', ...report.acquaImage });
            console.log(JSON.stringify({ checks: report.checks.length, failures: failures.length, acquaImage: report.acquaImage }, null, 2));
            if (failures.length) {
              console.error(JSON.stringify(failures, null, 2));
              process.exit(1);
            }
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node gate.cjs
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-fronts-integration-evidence
          path: /tmp/omni-fronts/artifacts
          retention-days: 14
      - name: Print logs on failure
        if: failure()
        run: tail -n 200 /tmp/aromia-fronts.log || true
