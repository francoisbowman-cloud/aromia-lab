name: Aromia isolated dependency patch proposal
on:
  push:
    branches:
      - security/aromia-runtime-safe-patches-20261117
    paths:
      - '.github/workflows/aromia-safe-patch-proposal.yml'
  pull_request:
    paths:
      - '.github/workflows/aromia-safe-patch-proposal.yml'
permissions:
  contents: write
jobs:
  patch-branch-only:
    if: github.repository == 'francoisbowman-cloud/aromia-lab' && ((github.event_name == 'push' && github.ref_name == 'security/aromia-runtime-safe-patches-20261117') || (github.event_name == 'pull_request' && github.head_ref == 'security/aromia-runtime-safe-patches-20261117' && github.event.pull_request.head.repo.full_name == 'francoisbowman-cloud/aromia-lab'))
    runs-on: ubuntu-24.04
    concurrency:
      group: aromia-security-patch-branch
      cancel-in-progress: true
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/aromia-runtime-safe-patches-20261117
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Baseline locked installs
        run: |
          npm ci --prefix apps/api
          npm ci --prefix apps/web
      - name: Apply narrowly scoped security-compatible updates
        run: |
          npm update --prefix apps/api express multer csv-parse proxy-addr body-parser js-yaml qs
          # Tiptap upgrades need a separate coordinated peer-dependency migration; do not force-install them.
          npm install --prefix apps/web --save-exact sharp@0.35.5
          npm update --prefix apps/web postcss source-map-js prosemirror-view
      - name: Verify updates before any commit
        run: |
          npm --prefix apps/api run build
          (cd apps/api && npx --no-install tsx --test src/intelligence/runtimeDependencyGate.test.ts)
          npm --prefix apps/web run test
          npm --prefix apps/web run lint
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build
      - name: Ensure package files are the only changed tracked files
        run: |
          if git diff --name-only | grep -Ev '^apps/(api|web)/package(-lock)?\.json$'; then
            echo 'Unexpected file changed, refusing branch update' >&2
            exit 1
          fi
      - name: Commit only into isolated remediation branch
        run: |
          git config user.name 'aromia-security-ci[bot]'
          git config user.email 'aromia-security-ci[bot]@users.noreply.github.com'
          git add apps/api/package.json apps/api/package-lock.json apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo 'No dependency changes proposed'
            exit 0
          fi
          git commit -m 'chore(deps): propose narrow runtime dependency security updates'
          git push origin HEAD:security/aromia-runtime-safe-patches-20261117
