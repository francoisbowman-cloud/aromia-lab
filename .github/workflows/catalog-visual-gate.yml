name: Catalog Visual Gate

on:
  pull_request:
    branches:
      - main

jobs:
  render-catalog:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start mock API
        run: |
          cat > /tmp/aromia-catalog-api.mjs <<'EOF'
          import http from 'node:http';
          const base = [
            ['baccarat-rouge-540','Baccarat Rouge 540','Maison Francis Kurkdjian','Ambarado floral','unisex','lujo','nicho',325],
            ['aventus','Aventus','Creed','Chipre frutal','masculino','lujo','nicho',365],
            ['bleu-de-chanel','Bleu de Chanel','Chanel','Amaderado aromático','masculino','premium','comercial',180],
            ['black-opium','Black Opium','Yves Saint Laurent','Ámbar vainilla','femenino','premium','comercial',155],
            ['tobacco-vanille','Tobacco Vanille','Tom Ford','Ámbar especiado','unisex','lujo','nicho',295],
            ['delina','Delina','Parfums de Marly','Floral','femenino','lujo','nicho',375],
            ['santal-33','Santal 33','Le Labo','Amaderado','unisex','lujo','nicho',230],
            ['light-blue','Light Blue','Dolce & Gabbana','Cítrico aromático','femenino','medio','comercial',105]
          ];
          const perfumes = base.map((p,i)=>({id:i+1,slug:p[0],nombre:p[1],marca:p[2],familia_olfativa:p[3],genero:p[4],categoria_precio:p[5],nicho_o_comercial:p[6],precio_referencia:p[7],moneda:'USD',imagen_url:null,link_afiliado:null}));
          http.createServer((req,res)=>{res.setHeader('Content-Type','application/json');if(req.url==='/api/perfumes')return res.end(JSON.stringify(perfumes));res.statusCode=404;res.end('{}');}).listen(4000,'127.0.0.1');
          EOF
          node /tmp/aromia-catalog-api.mjs >/tmp/catalog-api.log 2>&1 &
      - name: Start web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/catalog-web.log 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:3000/catalogo >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/catalog-web.log
          exit 1
      - name: Capture catalog
        run: |
          mkdir -p catalog-gate
          cat > catalog-gate/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          for (const [mode, viewport] of [['desktop',{width:1440,height:1100}],['mobile',{width:390,height:844}]]) {
            const page = await browser.newPage({viewport});
            await page.goto('http://127.0.0.1:3000/catalogo',{waitUntil:'networkidle'});
            await page.screenshot({path:`catalog-gate/catalog-${mode}.png`,fullPage:true});
            await page.goto('http://127.0.0.1:3000/catalogo?familia=Ambarado%20floral',{waitUntil:'networkidle'});
            await page.screenshot({path:`catalog-gate/catalog-filter-${mode}.png`,fullPage:true});
            await page.close();
          }
          await browser.close();
          EOF
          node catalog-gate/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: catalog-render-gate
          path: apps/web/catalog-gate
          retention-days: 7
