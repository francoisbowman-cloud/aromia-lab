name: OMNI Home Fire Test

on:
  push:
    branches: [feat/omni-home-operational-fire-test]

permissions:
  contents: read

jobs:
  repo-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/api/package-lock.json
      - name: Root gates
        run: |
          npm ci
          npm run catalog:test
          npm run audit:omni
      - name: API gate
        working-directory: apps/api
        run: |
          npm ci
          npx tsc --noEmit
          npm run build
      - name: Web gate
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run lint
          npx tsc --noEmit
          npm run build

  render-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PREVIEW_URL: https://web-omni-home-fire-test-production.up.railway.app
    steps:
      - name: Install browser harness
        run: |
          mkdir -p /tmp/omni-home-gate
          cd /tmp/omni-home-gate
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Render and prove
        run: |
          cd /tmp/omni-home-gate
          cat > gate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const url = process.env.PREVIEW_URL;
          const artifacts = '/tmp/omni-home-gate/artifacts';
          fs.mkdirSync(artifacts, { recursive: true });
          const report = { url, checks: {}, consoleErrors: [], pageErrors: [], failedRequests: [] };

          const assert = (condition, message) => { if (!condition) throw new Error(message); };
          const collect = page => {
            page.on('console', msg => { if (msg.type() === 'error') report.consoleErrors.push(msg.text()); });
            page.on('pageerror', err => report.pageErrors.push(err.message));
            page.on('requestfailed', req => report.failedRequests.push(`${req.method()} ${req.url()} :: ${req.failure()?.errorText || 'failed'}`));
          };
          async function ready(page) {
            let last;
            for (let i = 0; i < 8; i++) {
              try {
                const r = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 30000 });
                if (r?.ok()) { await page.waitForLoadState('networkidle', { timeout: 12000 }).catch(() => {}); return r; }
                last = new Error(`HTTP ${r?.status()}`);
              } catch (e) { last = e; }
              await page.waitForTimeout(3000);
            }
            throw last;
          }
          async function warm(page) {
            await page.evaluate(async () => {
              const step = Math.max(500, Math.round(innerHeight * .75));
              for (let y = 0; y < document.documentElement.scrollHeight; y += step) {
                scrollTo(0,y); await new Promise(r => setTimeout(r,120));
              }
              scrollTo(0,0);
            });
            await page.waitForTimeout(500);
          }
          async function inspect(page, label) {
            await warm(page);
            return page.evaluate(() => {
              const rect = el => { const r = el?.getBoundingClientRect(); return r ? { x:r.x,y:r.y,w:r.width,h:r.height } : null; };
              const canvases = [...document.querySelectorAll('canvas[role="img"]')];
              const visibleCanvases = canvases.filter(c => c.width > 0 && c.height > 0 && getComputedStyle(c).opacity !== '0');
              const unnamedLinks = [...document.querySelectorAll('a')].filter(a => !(a.textContent || '').trim() && !a.getAttribute('aria-label')).length;
              const unnamedButtons = [...document.querySelectorAll('button')].filter(b => !(b.textContent || '').trim() && !b.getAttribute('aria-label') && !b.getAttribute('title')).length;
              const h1 = document.querySelector('h1');
              const main = document.querySelector('main');
              const heroObject = [...document.querySelectorAll('*')].find(el => (el.textContent || '').trim() === 'Objeto editorial');
              const heroCanvas = heroObject?.parentElement?.parentElement?.querySelector('canvas[role="img"]');
              const productLink = [...document.querySelectorAll('a')].find(a => (a.textContent || '').includes('Ver fragancia'));
              const perf = performance.getEntriesByType('navigation')[0];
              return {
                overflow: document.documentElement.scrollWidth - innerWidth,
                bodyWidth: document.body.getBoundingClientRect().width,
                h1Count: document.querySelectorAll('h1').length,
                h1Text: h1?.textContent?.trim() || '',
                mainCount: document.querySelectorAll('main').length,
                heroCanvasVisible: !!heroCanvas && heroCanvas.width > 0 && heroCanvas.height > 0 && getComputedStyle(heroCanvas).opacity !== '0',
                heroCanvasRect: rect(heroCanvas),
                productHref: productLink?.getAttribute('href') || '',
                productLabel: productLink?.textContent?.replace(/\s+/g,' ').trim() || '',
                visibleCanvases: visibleCanvases.length,
                placeholders: document.querySelectorAll('[aria-label*="imagen temporalmente no disponible"]').length,
                unnamedLinks, unnamedButtons,
                loadMs: perf ? Math.round(perf.loadEventEnd || perf.domContentLoadedEventEnd) : null,
                resourceCount: performance.getEntriesByType('resource').length,
                scrollBehavior: getComputedStyle(document.documentElement).scrollBehavior,
                title: document.title,
                theme: document.documentElement.getAttribute('data-theme') || ''
              };
            });
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const desktop = await browser.newPage({ viewport: { width:1440, height:1000 }, colorScheme:'light' });
            collect(desktop);
            const r = await ready(desktop);
            report.checks.http = r.status();
            report.checks.desktopLight = await inspect(desktop, 'desktop-light');
            await desktop.screenshot({ path:`${artifacts}/desktop-light.png`, fullPage:true });
            await desktop.evaluate(() => document.documentElement.setAttribute('data-theme','dark'));
            await desktop.waitForTimeout(300);
            report.checks.desktopDark = await inspect(desktop, 'desktop-dark');
            await desktop.screenshot({ path:`${artifacts}/desktop-dark.png`, fullPage:true });

            const mobile = await browser.newPage({ viewport:{ width:390,height:844 }, colorScheme:'light' });
            collect(mobile); await ready(mobile);
            report.checks.mobile = await inspect(mobile, 'mobile');
            await mobile.screenshot({ path:`${artifacts}/mobile-light.png`, fullPage:true });

            const reduced = await browser.newPage({ viewport:{ width:1440,height:1000 }, reducedMotion:'reduce' });
            collect(reduced); await ready(reduced);
            report.checks.reduced = await reduced.evaluate(() => {
              const target = document.querySelector('canvas[role="img"]');
              const s = target ? getComputedStyle(target) : null;
              return { transitionDuration:s?.transitionDuration || '', animationDuration:s?.animationDuration || '', scrollBehavior:getComputedStyle(document.documentElement).scrollBehavior };
            });

            await browser.close();
            fs.writeFileSync(`${artifacts}/report.json`, JSON.stringify(report,null,2));

            const d = report.checks.desktopLight, m = report.checks.mobile;
            assert(report.checks.http === 200, `HTTP ${report.checks.http}`);
            assert(d.h1Count === 1 && d.h1Text.includes('El perfume no se elige'), 'Hero H1 regression');
            assert(d.mainCount === 1, 'Expected one main landmark');
            assert(d.overflow <= 2 && m.overflow <= 2, `Horizontal overflow desktop=${d.overflow}, mobile=${m.overflow}`);
            assert(d.heroCanvasVisible && m.heroCanvasVisible, 'Live catalog object is not visible in hero');
            assert(d.productHref.startsWith('/catalogo/'), `Hero object link is not PDP route: ${d.productHref}`);
            assert(d.visibleCanvases >= 4 && m.visibleCanvases >= 4, `Product media not healthy desktop=${d.visibleCanvases} mobile=${m.visibleCanvases}`);
            assert(d.placeholders === 0 && m.placeholders === 0, `Product placeholders desktop=${d.placeholders} mobile=${m.placeholders}`);
            assert(d.unnamedLinks === 0 && d.unnamedButtons === 0, `Unnamed controls links=${d.unnamedLinks} buttons=${d.unnamedButtons}`);
            assert(report.consoleErrors.length === 0 && report.pageErrors.length === 0, `Console/page errors: ${JSON.stringify({console:report.consoleErrors,page:report.pageErrors})}`);
            assert(report.checks.desktopDark.theme === 'dark', 'Dark theme did not apply');
            assert(report.checks.reduced.scrollBehavior === 'auto', `Reduced motion scroll behavior=${report.checks.reduced.scrollBehavior}`);
            const duration = report.checks.reduced.transitionDuration;
            assert(duration === '1e-05s' || duration === '0.00001s' || duration === '0s', `Reduced motion transition=${duration}`);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE
          node gate.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: omni-home-fire-test-evidence
          path: /tmp/omni-home-gate/artifacts
          retention-days: 7
