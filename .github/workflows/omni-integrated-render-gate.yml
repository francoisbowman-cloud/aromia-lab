name: OMNI Integrated Render Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-compare:
    if: github.head_ref == 'agent/omni-render-gate-integration' || github.head_ref == 'agent/omni-aromia-closure-integration' || github.head_ref == 'feat/aromia-visual-redesign-2026' || github.head_ref == 'design/catalog-125-editorial-canvas'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AROMIA_BASELINE_SHA: 880eb1b6a7b64949daf665d0f7bd98da753c14b8
      API_URL: https://api-production-fe2f.up.railway.app
      NEXT_PUBLIC_API_URL: https://api-production-fe2f.up.railway.app
    steps:
      - name: Checkout AFTER
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout BEFORE worktree
        shell: bash
        run: git worktree add /tmp/aromia-before "$AROMIA_BASELINE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        shell: bash
        run: |
          npm ci --prefix apps/web
          npm ci --prefix /tmp/aromia-before/apps/web

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/omni-render-gate
          cd /tmp/omni-render-gate
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start BEFORE and AFTER
        shell: bash
        run: |
          cd /tmp/aromia-before/apps/web
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3001 > /tmp/aromia-before.log 2>&1 &
          cd "$GITHUB_WORKSPACE/apps/web"
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3002 > /tmp/aromia-after.log 2>&1 &
          for port in 3001 3002; do
            ready=0
            for i in {1..90}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "App on port ${port} did not start"
              cat "/tmp/aromia-$([ "$port" = 3001 ] && echo before || echo after).log" || true
              exit 1
            fi
          done

      - name: Render, inspect and compare
        shell: bash
        run: |
          cd /tmp/omni-render-gate
          mkdir -p artifacts
          cat > gate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const origins = { before: 'http://127.0.0.1:3001', after: 'http://127.0.0.1:3002' };
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 },
          ];
          const routes = ['/catalogo'];
          function safeName(route) { return route === '/' ? 'home' : route.replace(/^\//, '').replace(/[^a-z0-9-]+/gi, '-'); }
          async function inspect(browser, label, origin, route, viewport) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
            const consoleErrors = []; const pageErrors = [];
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', (e) => pageErrors.push(String(e.message || e)));
            const response = await page.goto(`${origin}${route}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(700);
            const metrics = await page.evaluate(() => {
              const visible = (el) => { const r = el.getBoundingClientRect(); const s = getComputedStyle(el); return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none'; };
              const all = Array.from(document.querySelectorAll('main *')).filter(visible);
              const images = Array.from(document.images).filter(visible);
              const interactives = Array.from(document.querySelectorAll('a,button,input,select,summary')).filter(visible);
              return {
                overflowX: Math.max(0, document.documentElement.scrollWidth - window.innerWidth),
                brokenImages: images.filter((img) => img.complete && img.naturalWidth === 0).length,
                undersizedTargets: interactives.filter((el) => { const r = el.getBoundingClientRect(); return r.width < 44 || r.height < 44; }).length,
                h1Count: document.querySelectorAll('h1').length,
                productLinks: document.querySelectorAll('a[href^="/catalogo/"]').length,
                bodyBackground: getComputedStyle(document.querySelector('main')).backgroundColor,
              };
            });
            metrics.status = response?.status() ?? 0; metrics.consoleErrors = consoleErrors.length; metrics.pageErrors = pageErrors.length;
            await page.screenshot({ path: `artifacts/${label}-${safeName(route)}-${viewport.name}.png`, fullPage: true });
            await page.close(); return metrics;
          }
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = { baselineSha: process.env.AROMIA_BASELINE_SHA, before: {}, after: {}, acceptance: [] };
            for (const viewport of viewports) for (const route of routes) {
              const key = `${viewport.name}:${route}`;
              const b = report.before[key] = await inspect(browser, 'before', origins.before, route, viewport);
              const a = report.after[key] = await inspect(browser, 'after', origins.after, route, viewport);
              const hardFailures = [];
              if (a.status >= 400 || a.status === 0) hardFailures.push(`HTTP ${a.status}`);
              if (a.overflowX > 2) hardFailures.push(`horizontal overflow ${a.overflowX}px`);
              if (a.pageErrors > 0) hardFailures.push(`${a.pageErrors} page errors`);
              if (a.consoleErrors > b.consoleErrors) hardFailures.push(`console errors regressed ${b.consoleErrors}->${a.consoleErrors}`);
              if (a.brokenImages > b.brokenImages) hardFailures.push(`broken images regressed ${b.brokenImages}->${a.brokenImages}`);
              if (a.h1Count !== 1) hardFailures.push(`expected one h1, found ${a.h1Count}`);
              if (a.productLinks < 18) hardFailures.push(`expected at least 18 rendered product links, found ${a.productLinks}`);
              report.acceptance.push({ key, accepted: hardFailures.length === 0, hardFailures });
            }
            await browser.close();
            const failures = report.acceptance.filter((x) => !x.accepted);
            fs.writeFileSync('artifacts/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify({ checks: report.acceptance.length, failures: failures.length }, null, 2));
            if (failures.length) { console.error(JSON.stringify(failures, null, 2)); process.exit(1); }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          AROMIA_BASELINE_SHA="$AROMIA_BASELINE_SHA" node gate.cjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-125-editorial-before-after
          path: /tmp/omni-render-gate/artifacts
          retention-days: 14

      - name: Print app logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- BEFORE LOG ---'
          tail -n 160 /tmp/aromia-before.log || true
          echo '--- AFTER LOG ---'
          tail -n 160 /tmp/aromia-after.log || true
