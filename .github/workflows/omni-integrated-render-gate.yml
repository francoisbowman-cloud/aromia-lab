name: OMNI Integrated Render Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-compare:
    if: github.head_ref == 'agent/omni-render-gate-integration'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      AROMIA_BASELINE_SHA: 2f9220b8021c337c9761545012205b5af4aee9b7
      API_URL: https://api-production-fe2f.up.railway.app
      NEXT_PUBLIC_API_URL: https://api-production-fe2f.up.railway.app
    steps:
      - name: Checkout AFTER
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout BEFORE worktree
        shell: bash
        run: git worktree add /tmp/aromia-before "$AROMIA_BASELINE_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web dependencies
        shell: bash
        run: |
          npm ci --prefix apps/web
          npm ci --prefix /tmp/aromia-before/apps/web

      - name: Install Playwright
        shell: bash
        run: |
          mkdir -p /tmp/omni-render-gate
          cd /tmp/omni-render-gate
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium

      - name: Start BEFORE and AFTER
        shell: bash
        run: |
          cd /tmp/aromia-before/apps/web
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3001 > /tmp/aromia-before.log 2>&1 &
          cd "$GITHUB_WORKSPACE/apps/web"
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3002 > /tmp/aromia-after.log 2>&1 &
          for port in 3001 3002; do
            ready=0
            for i in {1..90}; do
              if curl -fsS "http://127.0.0.1:${port}/" >/dev/null; then ready=1; break; fi
              sleep 1
            done
            if [ "$ready" -ne 1 ]; then
              echo "App on port ${port} did not start"
              cat "/tmp/aromia-$([ "$port" = 3001 ] && echo before || echo after).log" || true
              exit 1
            fi
          done

      - name: Render, inspect and compare
        shell: bash
        run: |
          cd /tmp/omni-render-gate
          mkdir -p artifacts
          cat > gate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');

          const origins = {
            before: 'http://127.0.0.1:3001',
            after: 'http://127.0.0.1:3002',
          };
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 },
          ];
          const staticRoutes = ['/', '/catalogo', '/quiz', '/descubrir', '/academia', '/club', '/magazine'];

          async function resolvePdpSlug() {
            try {
              const response = await fetch('https://api-production-fe2f.up.railway.app/api/perfumes');
              if (!response.ok) return null;
              const rows = await response.json();
              return Array.isArray(rows) ? rows.find((p) => p && p.slug)?.slug ?? null : null;
            } catch { return null; }
          }

          function safeName(route) {
            return route === '/' ? 'home' : route.replace(/^\//, '').replace(/[^a-z0-9-]+/gi, '-');
          }

          async function inspect(browser, label, origin, route, viewport) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height }, deviceScaleFactor: 1 });
            const consoleErrors = [];
            const pageErrors = [];
            page.on('console', (m) => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', (e) => pageErrors.push(String(e.message || e)));

            const response = await page.goto(`${origin}${route}`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(400);
            const metrics = await page.evaluate(() => {
              const visible = (el) => {
                const r = el.getBoundingClientRect();
                const s = getComputedStyle(el);
                return r.width > 0 && r.height > 0 && s.visibility !== 'hidden' && s.display !== 'none';
              };
              const all = Array.from(document.querySelectorAll('main *')).filter(visible);
              const textEls = all.filter((el) => (el.textContent || '').trim() && el.children.length === 0);
              const fontSizes = textEls.map((el) => parseFloat(getComputedStyle(el).fontSize)).filter(Number.isFinite);
              const longRules = all.reduce((count, el) => {
                const r = el.getBoundingClientRect();
                if (r.width < window.innerWidth * .58) return count;
                const s = getComputedStyle(el);
                const top = parseFloat(s.borderTopWidth) > 0 && s.borderTopStyle !== 'none';
                const bottom = parseFloat(s.borderBottomWidth) > 0 && s.borderBottomStyle !== 'none';
                return count + Number(top) + Number(bottom);
              }, 0);
              const images = Array.from(document.images).filter(visible);
              const brokenImages = images.filter((img) => img.complete && img.naturalWidth === 0).length;
              const interactives = Array.from(document.querySelectorAll('a,button,input,select,summary')).filter(visible);
              const undersizedTargets = interactives.filter((el) => {
                const r = el.getBoundingClientRect();
                return r.width < 44 || r.height < 44;
              }).length;
              const headings = Array.from(document.querySelectorAll('h1,h2,h3')).filter(visible);
              const maxHeadingPx = headings.reduce((max, el) => Math.max(max, parseFloat(getComputedStyle(el).fontSize) || 0), 0);
              return {
                overflowX: Math.max(0, document.documentElement.scrollWidth - window.innerWidth),
                longHorizontalRules: longRules,
                visibleTextNodes: fontSizes.length,
                textBelow12px: fontSizes.filter((n) => n < 12).length,
                textBelow14px: fontSizes.filter((n) => n < 14).length,
                brokenImages,
                interactiveCount: interactives.length,
                undersizedTargets,
                maxHeadingPx,
                h1Count: document.querySelectorAll('h1').length,
              };
            });
            metrics.status = response?.status() ?? 0;
            metrics.consoleErrors = consoleErrors.length;
            metrics.pageErrors = pageErrors.length;
            await page.screenshot({ path: `artifacts/${label}-${safeName(route)}-${viewport.name}.png`, fullPage: true });
            await page.close();
            return metrics;
          }

          (async () => {
            const slug = await resolvePdpSlug();
            const routes = [...staticRoutes, ...(slug ? [`/catalogo/${slug}`] : [])];
            const browser = await chromium.launch({ headless: true });
            const report = { baselineSha: process.env.AROMIA_BASELINE_SHA, routes, viewports, before: {}, after: {}, delta: {}, acceptance: [] };

            for (const viewport of viewports) {
              for (const route of routes) {
                const key = `${viewport.name}:${route}`;
                report.before[key] = await inspect(browser, 'before', origins.before, route, viewport);
                report.after[key] = await inspect(browser, 'after', origins.after, route, viewport);
                const b = report.before[key];
                const a = report.after[key];
                report.delta[key] = {
                  overflowX: a.overflowX - b.overflowX,
                  longHorizontalRules: a.longHorizontalRules - b.longHorizontalRules,
                  textBelow12px: a.textBelow12px - b.textBelow12px,
                  brokenImages: a.brokenImages - b.brokenImages,
                  undersizedTargets: a.undersizedTargets - b.undersizedTargets,
                  maxHeadingPx: a.maxHeadingPx - b.maxHeadingPx,
                };

                const hardFailures = [];
                if (a.status >= 400 || a.status === 0) hardFailures.push(`HTTP ${a.status}`);
                if (a.overflowX > 2) hardFailures.push(`horizontal overflow ${a.overflowX}px`);
                if (a.pageErrors > 0) hardFailures.push(`${a.pageErrors} page errors`);
                if (a.consoleErrors > b.consoleErrors) hardFailures.push(`console errors regressed ${b.consoleErrors}->${a.consoleErrors}`);
                if (a.brokenImages > b.brokenImages) hardFailures.push(`broken images regressed ${b.brokenImages}->${a.brokenImages}`);
                if (a.h1Count !== 1) hardFailures.push(`expected one h1, found ${a.h1Count}`);
                report.acceptance.push({ key, accepted: hardFailures.length === 0, hardFailures });
              }
            }

            await browser.close();
            const failures = report.acceptance.filter((x) => !x.accepted);
            fs.writeFileSync('artifacts/report.json', JSON.stringify(report, null, 2));

            const summary = {
              checks: report.acceptance.length,
              failures: failures.length,
              longRuleDelta: Object.values(report.delta).reduce((n, d) => n + d.longHorizontalRules, 0),
              tinyTextDelta: Object.values(report.delta).reduce((n, d) => n + d.textBelow12px, 0),
              undersizedTargetDelta: Object.values(report.delta).reduce((n, d) => n + d.undersizedTargets, 0),
            };
            console.log(JSON.stringify(summary, null, 2));
            if (failures.length) {
              console.error(JSON.stringify(failures, null, 2));
              process.exit(1);
            }
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
          AROMIA_BASELINE_SHA="$AROMIA_BASELINE_SHA" node gate.cjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-integrated-before-after
          path: /tmp/omni-render-gate/artifacts
          retention-days: 14

      - name: Print app logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- BEFORE LOG ---'
          tail -n 160 /tmp/aromia-before.log || true
          echo '--- AFTER LOG ---'
          tail -n 160 /tmp/aromia-after.log || true
