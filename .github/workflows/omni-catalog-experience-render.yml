name: OMNI Catalog Experience Render

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  catalog-render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_URL: https://api-production-fe2f.up.railway.app
      NEXT_PUBLIC_API_URL: https://api-production-fe2f.up.railway.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout current main baseline
        shell: bash
        run: git worktree add /tmp/aromia-before "${{ github.event.pull_request.base.sha }}"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        run: |
          npm ci --prefix apps/web
          npm ci --prefix /tmp/aromia-before/apps/web
      - name: Install Playwright
        run: |
          mkdir -p /tmp/omni-catalog-render
          cd /tmp/omni-catalog-render
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null
          npx playwright install --with-deps chromium
      - name: Start baseline and candidate
        shell: bash
        run: |
          cd /tmp/aromia-before/apps/web
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3001 > /tmp/aromia-before.log 2>&1 &
          cd "$GITHUB_WORKSPACE/apps/web"
          API_URL="$API_URL" NEXT_PUBLIC_API_URL="$NEXT_PUBLIC_API_URL" npm run dev -- -p 3002 > /tmp/aromia-after.log 2>&1 &
          for port in 3001 3002; do
            for i in {1..90}; do
              curl -fsS "http://127.0.0.1:${port}/catalogo" >/dev/null && break
              sleep 1
            done
            curl -fsS "http://127.0.0.1:${port}/catalogo" >/dev/null
          done
      - name: Render and compare catalog
        shell: bash
        run: |
          cd /tmp/omni-catalog-render
          mkdir -p artifacts
          cat > gate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const viewports = [
            { name: 'mobile', width: 390, height: 844 },
            { name: 'tablet', width: 768, height: 1024 },
            { name: 'desktop', width: 1440, height: 1000 },
          ];
          async function inspect(browser, label, port, viewport) {
            const page = await browser.newPage({ viewport: { width: viewport.width, height: viewport.height } });
            const consoleErrors = [], pageErrors = [];
            page.on('console', m => { if (m.type() === 'error') consoleErrors.push(m.text()); });
            page.on('pageerror', e => pageErrors.push(String(e.message || e)));
            const response = await page.goto(`http://127.0.0.1:${port}/catalogo`, { waitUntil: 'networkidle', timeout: 60000 });
            await page.waitForTimeout(500);
            const metrics = await page.evaluate(() => ({
              height: document.documentElement.scrollHeight,
              overflowX: Math.max(0, document.documentElement.scrollWidth - innerWidth),
              cards: document.querySelectorAll('main article').length,
              interactives: Array.from(document.querySelectorAll('main a,main button,main input,main select,main summary')).filter(el => { const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0; }).length,
              h1Count: document.querySelectorAll('main h1').length,
              resultText: Array.from(document.querySelectorAll('main *')).map(el => (el.textContent || '').trim()).find(t => /^\d+ \/ \d+$/.test(t)) || null,
            }));
            metrics.status = response?.status() ?? 0;
            metrics.consoleErrors = consoleErrors.length;
            metrics.pageErrors = pageErrors.length;
            await page.screenshot({ path: `artifacts/${label}-catalogo-${viewport.name}.png`, fullPage: true });
            await page.close();
            return metrics;
          }
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = { before: {}, after: {}, delta: {}, acceptance: [] };
            for (const viewport of viewports) {
              const b = await inspect(browser, 'before', 3001, viewport);
              const a = await inspect(browser, 'after', 3002, viewport);
              report.before[viewport.name] = b;
              report.after[viewport.name] = a;
              report.delta[viewport.name] = {
                height: a.height - b.height,
                heightPct: b.height ? (a.height / b.height) - 1 : null,
                cards: a.cards - b.cards,
                interactives: a.interactives - b.interactives,
              };
              const failures = [];
              if (a.status >= 400 || a.status === 0) failures.push(`HTTP ${a.status}`);
              if (a.overflowX > 2) failures.push(`horizontal overflow ${a.overflowX}px`);
              if (a.pageErrors > 0) failures.push(`${a.pageErrors} page errors`);
              if (a.consoleErrors > b.consoleErrors) failures.push(`console errors ${b.consoleErrors}->${a.consoleErrors}`);
              if (a.h1Count !== 1) failures.push(`expected one h1, found ${a.h1Count}`);
              if (b.cards >= 100 && a.cards !== 24) failures.push(`expected 24 initial cards, found ${a.cards}`);
              if (b.cards >= 100 && a.height >= b.height * 0.4) failures.push(`page depth not materially reduced: ${b.height}->${a.height}`);
              report.acceptance.push({ viewport: viewport.name, accepted: failures.length === 0, failures });
            }
            await browser.close();
            fs.writeFileSync('artifacts/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (report.acceptance.some(x => !x.accepted)) process.exit(1);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          node gate.cjs
      - name: Upload closed-loop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-catalog-experience-before-after
          path: /tmp/omni-catalog-render/artifacts
          retention-days: 14
