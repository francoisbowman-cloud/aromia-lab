name: Aromia Visual Final Gate

on:
  pull_request:
    branches: [main]

jobs:
  render-matrix:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start mock API
        run: |
          cat > /tmp/aromia-final-api.mjs <<'EOF'
          import http from 'node:http';
          const perfumes=[
            {id:1,slug:'baccarat-rouge-540',nombre:'Baccarat Rouge 540',marca:'Maison Francis Kurkdjian',familia_olfativa:'amaderado',genero:'unisex',categoria_precio:'lujo',nicho_o_comercial:'nicho',precio_referencia:325,moneda:'USD',imagen_url:null,link_afiliado:null,rating_promedio:4.8,descripcion_corta:'Una firma luminosa de azafrán, ámbar y cedro.',notas_salida:['Azafrán'],notas_corazon:['Ámbar'],notas_fondo:['Cedro'],longevidad:9,estela:8,proyeccion:8,retailers:[{id:1,perfume_id:1,nombre:'Retailer editorial',detalle:'70 ml · Eau de parfum',precio:325,moneda:'USD',link_afiliado:'https://example.com',orden:1}]},
            {id:2,slug:'aventus',nombre:'Aventus',marca:'Creed',familia_olfativa:'amaderado aromatico',genero:'masculino',categoria_precio:'lujo',nicho_o_comercial:'nicho',precio_referencia:365,moneda:'USD',imagen_url:null,link_afiliado:null,rating_promedio:4.7,descripcion_corta:'Piña, abedul y maderas con una firma expansiva.'},
            {id:3,slug:'bleu-de-chanel',nombre:'Bleu de Chanel',marca:'Chanel',familia_olfativa:'aromatico fresco',genero:'masculino',categoria_precio:'premium',nicho_o_comercial:'comercial',precio_referencia:180,moneda:'USD',imagen_url:null,link_afiliado:null,rating_promedio:4.6,descripcion_corta:'Cítricos, incienso y maderas en equilibrio.'},
            {id:4,slug:'black-opium',nombre:'Black Opium',marca:'Yves Saint Laurent',familia_olfativa:'oriental gourmand',genero:'femenino',categoria_precio:'premium',nicho_o_comercial:'comercial',precio_referencia:155,moneda:'USD',imagen_url:null,link_afiliado:null,rating_promedio:4.5,descripcion_corta:'Café, vainilla y flores blancas de alto contraste.'},
            {id:5,slug:'tobacco-vanille',nombre:'Tobacco Vanille',marca:'Tom Ford',familia_olfativa:'ambarado especiado',genero:'unisex',categoria_precio:'lujo',nicho_o_comercial:'nicho',precio_referencia:295,moneda:'USD',imagen_url:null,link_afiliado:null,rating_promedio:4.7,descripcion_corta:'Tabaco dulce, especias y vainilla envolvente.'}
          ];
          const articles=[
            {id:1,slug:'materia-y-memoria',titulo:'Materia y memoria: por qué un perfume permanece',categoria:'analisis',imagen_portada_url:null,autor:'Aromia Editorial',meta_description:'Una lectura editorial sobre materia, memoria y perfume.',perfumes_relacionados:[1,2],publicado_en:'2026-08-01T12:00:00Z'},
            {id:2,slug:'azafran-luz',titulo:'Azafrán, luz y transparencia',categoria:'academia',imagen_portada_url:null,autor:'Aromia Editorial',meta_description:'El azafrán como materia olfativa.',perfumes_relacionados:[1],publicado_en:'2026-07-28T12:00:00Z'},
            {id:3,slug:'maderas-modernas',titulo:'La nueva arquitectura de las maderas',categoria:'tendencias',imagen_portada_url:null,autor:'Aromia Editorial',meta_description:'Maderas modernas y composición.',perfumes_relacionados:[2,3],publicado_en:'2026-07-20T12:00:00Z'},
            {id:4,slug:'gourmand-sin-exceso',titulo:'Gourmand sin exceso: cómo leer la dulzura',categoria:'guia',imagen_portada_url:null,autor:'Aromia Editorial',meta_description:'Guía para entender perfiles gourmand.',perfumes_relacionados:[4,5],publicado_en:'2026-07-14T12:00:00Z'}
          ];
          http.createServer((req,res)=>{
            res.setHeader('Content-Type','application/json');
            if(req.url==='/api/perfumes') return res.end(JSON.stringify(perfumes));
            if(req.url?.startsWith('/api/perfumes/')) { const slug=req.url.split('/').pop(); const p=perfumes.find(x=>x.slug===slug); if(!p){res.statusCode=404;return res.end('{}');} return res.end(JSON.stringify(p)); }
            if(req.url==='/api/articulos') return res.end(JSON.stringify(articles));
            if(req.url?.startsWith('/api/articulos/')) { const slug=req.url.split('/').pop(); const a=articles.find(x=>x.slug===slug); if(!a){res.statusCode=404;return res.end('{}');} return res.end(JSON.stringify(a)); }
            if(req.url==='/api/subscribers' && req.method==='POST') {res.statusCode=201; return res.end(JSON.stringify({ok:true}));}
            res.statusCode=404;res.end('{}');
          }).listen(4000,'127.0.0.1');
          EOF
          node /tmp/aromia-final-api.mjs >/tmp/final-api.log 2>&1 &
      - name: Start web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/final-web.log 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:3000/ >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/final-web.log; exit 1
      - name: Capture full visual matrix
        run: |
          mkdir -p final-gate
          cat > final-gate/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const routes=[
            ['home','/'],
            ['catalog','/catalogo'],
            ['product','/catalogo/baccarat-rouge-540'],
            ['magazine','/magazine'],
            ['quiz','/quiz'],
            ['quiz-result','/quiz/resultado/amaderado-silencioso']
          ];
          for(const [mode,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const theme of ['light','dark']){
              for(const [name,path] of routes){
                const page=await browser.newPage({viewport});
                await page.goto(`http://127.0.0.1:3000${path}`,{waitUntil:'networkidle'});
                await page.evaluate((theme)=>document.documentElement.setAttribute('data-theme',theme),theme);
                await page.waitForTimeout(150);
                await page.screenshot({path:`final-gate/${name}-${mode}-${theme}.png`,fullPage:true});
                await page.close();
              }
            }
          }
          await browser.close();
          EOF
          node final-gate/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aromia-visual-final-gate
          path: apps/web/final-gate
          retention-days: 7
