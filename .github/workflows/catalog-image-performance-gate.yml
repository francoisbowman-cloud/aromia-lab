name: Catalog Image Performance Gate

on:
  pull_request:
    branches: [main]

jobs:
  lazy-images:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start mock API
        run: |
          cat > /tmp/aromia-perf-api.mjs <<'EOF'
          import http from 'node:http';
          const perfumes=Array.from({length:40},(_,i)=>({id:i+1,slug:`perfume-${i+1}`,nombre:`Perfume ${i+1}`,marca:'Aromia Test',familia_olfativa:'amaderado',genero:'unisex',categoria_precio:'premium',nicho_o_comercial:'nicho',precio_referencia:150+i,moneda:'USD',imagen_url:`http://127.0.0.1:4000/img/${i+1}.svg`,link_afiliado:null}));
          http.createServer((req,res)=>{
            res.setHeader('Access-Control-Allow-Origin','*');
            if(req.url==='/api/perfumes'){res.setHeader('Content-Type','application/json');return res.end(JSON.stringify(perfumes));}
            if(req.url?.startsWith('/img/')){res.setHeader('Content-Type','image/svg+xml');const id=req.url.split('/').pop()?.replace('.svg','');return res.end(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="800"><rect width="600" height="800" fill="#f2eadc"/><rect x="220" y="180" width="160" height="420" rx="30" fill="#b68a44"/><text x="300" y="700" text-anchor="middle" font-size="32">${id}</text></svg>`);}
            res.statusCode=404;res.end('{}');
          }).listen(4000,'127.0.0.1');
          EOF
          node /tmp/aromia-perf-api.mjs >/tmp/perf-api.log 2>&1 &
      - name: Start web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/perf-web.log 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:3000/catalogo >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/perf-web.log; exit 1
      - name: Assert lazy image behavior
        run: |
          cat > /tmp/assert-lazy.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const page=await browser.newPage({viewport:{width:1440,height:900}});
          await page.goto('http://127.0.0.1:3000/catalogo',{waitUntil:'domcontentloaded'});
          await page.waitForTimeout(1200);
          const count=()=>page.evaluate(()=>performance.getEntriesByType('resource').filter(e=>e.name.includes('/img/')).length);
          const initial=await count();
          if(initial>=40) throw new Error(`Lazy-load regression: initial viewport requested ${initial}/40 images`);
          await page.evaluate(()=>window.scrollTo(0,document.body.scrollHeight));
          await page.waitForTimeout(1800);
          const afterScroll=await count();
          if(afterScroll<=initial) throw new Error(`Lazy-load did not advance after scroll: initial=${initial}, after=${afterScroll}`);
          console.log(`PASS lazy images: initial=${initial}/40, afterScroll=${afterScroll}/40`);
          await browser.close();
          EOF
          node /tmp/assert-lazy.mjs
