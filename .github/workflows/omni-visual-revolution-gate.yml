name: OMNI Visual Revolution Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  perceptual-contract:
    if: startsWith(github.head_ref, 'feat/visual-') || startsWith(github.head_ref, 'agent/omni-visual-')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_URL: https://api-production-fe2f.up.railway.app
      NEXT_PUBLIC_API_URL: https://api-production-fe2f.up.railway.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install web dependencies
        run: npm ci --prefix apps/web
      - name: Bind Playwright to runner Chrome
        shell: bash
        run: |
          mkdir -p /tmp/aromia-visual-gate
          cd /tmp/aromia-visual-gate
          npm init -y >/dev/null 2>&1
          npm install playwright-core@1.55.0 >/dev/null
          CHROME_PATH="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME_PATH"
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Start Aromia branch
        run: |
          cd apps/web
          npm run dev -- -p 3002 > /tmp/aromia-visual-gate.log 2>&1 &
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3002/catalogo >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/aromia-visual-gate.log
          exit 1
      - name: Exercise catalog, Home and representative geometry classes
        shell: bash
        run: |
          cd /tmp/aromia-visual-gate
          mkdir -p artifacts
          cat > gate.cjs <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright-core');
          const representatives = [
            ['acqua-di-gio-edt','tall'],
            ['bleu-de-chanel-edp','standard'],
            ['chance-eau-tendre','compact'],
            ['flowerbomb','wide'],
            ['good-girl','sculptural'],
            ['angel-edp','sculptural'],
          ];
          const viewports = [
            ['mobile',390,844],
            ['tablet',768,1024],
            ['desktop',1440,1000],
          ];

          (async () => {
            const browser = await chromium.launch({ headless: true, executablePath: process.env.CHROME_PATH, args: ['--no-sandbox'] });
            const report = { representatives: {}, pages: {} };

            for (const [slug, expectedGeometry] of representatives) {
              const imageResponse = await fetch(`http://127.0.0.1:3002/api/catalog-image/${slug}`);
              const imageOrigin = imageResponse.headers.get('x-aromia-image-origin');
              if (!imageResponse.ok || !String(imageResponse.headers.get('content-type')).startsWith('image/') || !imageOrigin || imageOrigin === 'placeholder') {
                throw new Error(`${slug}: verified product image unavailable; origin=${imageOrigin}`);
              }
              report.representatives[slug] = { expectedGeometry, imageOrigin, viewports: {} };

              for (const [name,width,height] of viewports) {
                const page = await browser.newPage({ viewport: { width, height } });
                const errors = [];
                page.on('pageerror', e => errors.push(String(e.message || e)));
                const response = await page.goto(`http://127.0.0.1:3002/catalogo/${slug}`, { waitUntil: 'networkidle', timeout: 60000 });
                await page.waitForTimeout(250);
                const metrics = await page.evaluate(() => {
                  const stage = document.querySelector('[data-product-stage="true"]');
                  const image = stage?.querySelector('[data-product-image="true"]');
                  if (!stage || !image) return null;
                  const s = stage.getBoundingClientRect();
                  const i = image.getBoundingClientRect();
                  return {
                    geometry: stage.getAttribute('data-product-geometry'),
                    stageWhite: getComputedStyle(stage).backgroundColor === 'rgb(255, 255, 255)',
                    maxAxisCoverage: Math.max(i.width / s.width, i.height / s.height),
                    overflowX: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                    brokenImages: Array.from(document.images).filter(img => img.complete && img.naturalWidth === 0).length,
                  };
                });
                if (!metrics) throw new Error(`${slug}/${name}: product stage missing`);
                report.representatives[slug].viewports[name] = { status: response?.status() ?? 0, errors, ...metrics };
                if ((response?.status() ?? 500) >= 400 || errors.length || metrics.brokenImages || metrics.overflowX > 2 || !metrics.stageWhite) throw new Error(`${slug}/${name}: fidelity contract failed`);
                if (metrics.geometry !== expectedGeometry) throw new Error(`${slug}: expected ${expectedGeometry}, got ${metrics.geometry}`);
                if (metrics.maxAxisCoverage < .68 || metrics.maxAxisCoverage > .98) throw new Error(`${slug}/${name}: optical coverage ${metrics.maxAxisCoverage.toFixed(3)} outside contract`);
                if (name !== 'tablet') await page.screenshot({ path: `artifacts/${slug}-${name}.png`, fullPage: true });
                await page.close();
              }
            }

            for (const [name,width,height] of viewports) {
              const page = await browser.newPage({ viewport: { width, height } });
              const errors = [];
              page.on('pageerror', e => errors.push(String(e.message || e)));
              const home = await page.goto('http://127.0.0.1:3002/', { waitUntil: 'networkidle', timeout: 60000 });
              const homeMetrics = await page.evaluate(() => ({
                h1: document.querySelector('h1')?.textContent?.trim() || '',
                productStages: document.querySelectorAll('[data-product-stage="true"]').length,
                atmospheres: document.querySelectorAll('.aromia-atmosphere').length,
                overflowX: Math.max(0, document.documentElement.scrollWidth - innerWidth),
                brokenImages: Array.from(document.images).filter(img => img.complete && img.naturalWidth === 0).length,
              }));
              if ((home?.status() ?? 500) >= 400 || errors.length || homeMetrics.brokenImages || homeMetrics.overflowX > 2 || homeMetrics.productStages < 2 || homeMetrics.atmospheres < 2) throw new Error(`Home/${name}: ${JSON.stringify({errors, homeMetrics})}`);
              report.pages[`home-${name}`] = homeMetrics;
              if (name !== 'tablet') await page.screenshot({ path: `artifacts/home-${name}.png`, fullPage: true });

              const catalog = await page.goto('http://127.0.0.1:3002/catalogo', { waitUntil: 'networkidle', timeout: 60000 });
              if ((catalog?.status() ?? 500) >= 400) throw new Error(`Catalog/${name}: HTTP failure`);
              if (name === 'mobile') {
                const details = page.locator('details').first();
                await details.locator('summary').click();
                if (!(await details.evaluate(el => el.hasAttribute('open')))) throw new Error('Mobile filters did not open');
                const firstSelect = details.locator('select').first();
                const options = await firstSelect.locator('option').count();
                if (options > 1) {
                  await firstSelect.selectOption({ index: 1 });
                  const clear = page.getByRole('button', { name: /Borrar filtros/i });
                  if (await clear.isDisabled()) throw new Error('Clear filters remained disabled after selection');
                  await clear.click();
                }
              }
              const catalogMetrics = await page.evaluate(() => ({
                stages: document.querySelectorAll('[data-product-stage="true"]').length,
                nonWhiteStages: Array.from(document.querySelectorAll('[data-product-stage="true"]')).filter(el => getComputedStyle(el).backgroundColor !== 'rgb(255, 255, 255)').length,
                overflowX: Math.max(0, document.documentElement.scrollWidth - innerWidth),
              }));
              if (catalogMetrics.stages < 4 || catalogMetrics.nonWhiteStages || catalogMetrics.overflowX > 2) throw new Error(`Catalog/${name}: ${JSON.stringify(catalogMetrics)}`);
              report.pages[`catalog-${name}`] = catalogMetrics;
              await page.close();
            }

            await browser.close();
            fs.writeFileSync('artifacts/report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
          CHROME_PATH="$CHROME_PATH" node gate.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omni-visual-revolution-evidence
          path: /tmp/aromia-visual-gate/artifacts
          retention-days: 14
      - name: Print app log on failure
        if: failure()
        run: tail -n 220 /tmp/aromia-visual-gate.log || true
