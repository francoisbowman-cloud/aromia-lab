name: Editorial v1 deterministic photo transport

on:
  push:
    branches:
      - feat/editorial-v1-implementation
    paths:
      - .asset-transport/READY

permissions:
  contents: write

jobs:
  reassemble-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: feat/editorial-v1-implementation
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Reassemble ZIP and validate every JPEG before touching canonical assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, json, zipfile, shutil

          root = Path('.asset-transport')
          chunks = sorted(root.glob('chunk-*.b64'))
          expected_count = 20
          if len(chunks) != expected_count:
              raise SystemExit(f'expected {expected_count} chunks, found {len(chunks)}')

          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in chunks)
          raw = base64.b64decode(encoded, validate=True)
          zip_sha = hashlib.sha256(raw).hexdigest()
          expected_zip_sha = 'b6682c45d0953cbddcad02efe4bb29d04618534d43358d19e704a33193d44e02'
          if zip_sha != expected_zip_sha:
              raise SystemExit(f'ZIP SHA mismatch: {zip_sha}')

          zf = zipfile.ZipFile(io.BytesIO(raw))
          expected = {
              'ambroxan-resin-abstract-01.jpg': 'b3489c14fc7ac302faabf6ebe13692d43e9f62bdb7c4bd985da1b2641c1e242c',
              'ropion-bordeaux-texture-01.jpg': '8be9b43a17a6ae3a66498901fc1f0015c384f2172f4a4d9125b67efba0976372',
              'amouage-mineral-density-01.jpg': '2f481ddf26ba71d54506c72a88a27d9e1717522e1f3d4886ecceb4df4bfd527a',
          }
          out = Path('apps/web/public/editorial-v1')
          out.mkdir(parents=True, exist_ok=True)
          manifest = {'transport':'chunked-base64-zip','zip_sha256':zip_sha,'classification':'interpretive, not documentary','outputs':{}}

          for name, expected_sha in expected.items():
              data = zf.read(name)
              sha = hashlib.sha256(data).hexdigest()
              if sha != expected_sha:
                  raise SystemExit(f'{name}: SHA mismatch {sha}')
              if data[:3] != b'\xff\xd8\xff':
                  raise SystemExit(f'{name}: invalid JPEG magic {data[:3].hex()}')
              im = Image.open(io.BytesIO(data))
              im.verify()
              im = Image.open(io.BytesIO(data))
              if im.format != 'JPEG' or im.size != (1600,900):
                  raise SystemExit(f'{name}: decode/dimensions failed {im.format} {im.size}')
              (out/name).write_bytes(data)
              manifest['outputs'][name] = {'sha256':sha,'bytes':len(data),'magic':data[:3].hex(),'width':1600,'height':900,'format':'JPEG'}

          Path('art-direction/EDITORIAL_V1_FINAL_PHOTO_ASSETS.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Commit verified binaries and remove temporary transport scaffolding
        run: |
          git config user.name "AROMIA Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/editorial-v1/ambroxan-resin-abstract-01.jpg \
                  apps/web/public/editorial-v1/ropion-bordeaux-texture-01.jpg \
                  apps/web/public/editorial-v1/amouage-mineral-density-01.jpg \
                  art-direction/EDITORIAL_V1_FINAL_PHOTO_ASSETS.json
          git rm -r .asset-transport
          git rm -f .github/workflows/editorial-v1-chunked-photo-transport.yml \
                    .github/workflows/canva-asset-probe.yml \
                    .github/workflows/editorial-v1-photo-materialize-v2.yml || true
          git commit -m "art(editorial-v1): install verified final photographic JPEGs"
          git push origin HEAD:feat/editorial-v1-implementation
