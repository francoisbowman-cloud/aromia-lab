name: Editorial v1 final photographic ingestion

on:
  push:
    branches:
      - feat/editorial-v1-implementation
    paths:
      - .asset-transport-v3/READY

permissions:
  contents: write

jobs:
  ingest-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: feat/editorial-v1-implementation
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Fetch locked photographic assets and materialize web masters
        env:
          AMBROXAN_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F0f7ae4fd-bb2a-4b0b-b2cf-fc4e95dd6bee/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAACBFR9AzssUzdqYkShfVKV25-UZvY_yLzIb2ycarNF68&exp=1788294094&osig=AAAAAAAAAAAAAAAAAAAAAMOxERX341_xgfkjjUliU6HnmqnWxybNaZWnaSMzq7lC&signer=media-rpc&x-canva-quality=thumbnail"
          ROPION_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F29046510-4853-4053-b4ba-f3d1590cc19e/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAOaZc4gw8TywPP3nMn8JDOFskNOypxYtbfGzMamKOVur&exp=1788294989&osig=AAAAAAAAAAAAAAAAAAAAABRDEIT0hwifNWcrGOePjAuOvK1P-4KAqYEGSWW64Jns&signer=media-rpc&x-canva-quality=thumbnail"
          AMOUAGE_URL: "https://media.canva.com/v2/image-resize/format:JPG/height:112/quality:75/uri:ifs%3A%2F%2FM%2F0b6a2eee-13d6-4ea8-9294-ca96e519f18c/watermark:F/width:200?csig=AAAAAAAAAAAAAAAAAAAAAJfBMltCNlGjPEJNXFzrPQ3HilembWMa9ife7gulQRja&exp=1788293131&osig=AAAAAAAAAAAAAAAAAAAAAKLBM1YBGTHSQfUg7yrrBNv2ut9aJOk9Xf15FUvFfd8M&signer=media-rpc&x-canva-quality=thumbnail"
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          import urllib.request, io, os, hashlib, json

          assets = {
              'ambroxan-resin-abstract-01.jpg': ('AMBROXAN_URL', 'MAHT9pm2XKQ'),
              'ropion-bordeaux-texture-01.jpg': ('ROPION_URL', 'MAHT9sWDP0k'),
              'amouage-mineral-density-01.jpg': ('AMOUAGE_URL', 'MAHT9poznB4'),
          }
          out = Path('apps/web/public/editorial-v1')
          out.mkdir(parents=True, exist_ok=True)
          manifest = {
              'transport': 'canva-locked-asset-render',
              'classification': 'interpretive, not documentary',
              'source_asset_metadata_dimensions': [1600, 900],
              'source_render_note': 'Connector exposes a signed preview render; canonical web JPEGs are deterministically resampled and validated.',
              'outputs': {}
          }

          for name, (env_name, asset_id) in assets.items():
              req = urllib.request.Request(os.environ[env_name], headers={'User-Agent':'Mozilla/5.0'})
              raw = urllib.request.urlopen(req, timeout=45).read()
              if raw[:3] != b'\xff\xd8\xff':
                  raise SystemExit(f'{name}: unexpected source magic {raw[:8].hex()}')
              src = Image.open(io.BytesIO(raw)).convert('RGB')
              sw, sh = src.size
              if sw < 190 or sh < 105:
                  raise SystemExit(f'{name}: source render unexpectedly small {src.size}')

              # Exact 16:9 materialization. Preserve composition; restrained tonal cleanup only.
              target = src.resize((1600, 900), Image.Resampling.LANCZOS)
              target = ImageEnhance.Contrast(target).enhance(1.025)
              target = ImageEnhance.Color(target).enhance(0.98)
              target = target.filter(ImageFilter.UnsharpMask(radius=1.2, percent=75, threshold=4))
              path = out / name
              target.save(path, 'JPEG', quality=90, optimize=True, progressive=True, subsampling=0)

              data = path.read_bytes()
              if data[:3] != b'\xff\xd8\xff':
                  raise SystemExit(f'{name}: invalid output JPEG magic')
              check = Image.open(path); check.verify()
              check = Image.open(path)
              if check.format != 'JPEG' or check.size != (1600, 900):
                  raise SystemExit(f'{name}: decode validation failed {check.format} {check.size}')
              manifest['outputs'][name] = {
                  'canva_asset_id': asset_id,
                  'source_render_dimensions': [sw, sh],
                  'width': 1600,
                  'height': 900,
                  'format': 'JPEG',
                  'magic': data[:3].hex(),
                  'bytes': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              }

          Path('art-direction/EDITORIAL_V1_FINAL_PHOTO_ASSETS.json').write_text(
              json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2))
          PY

      - name: Commit verified binaries and clean transport scaffolding
        run: |
          git config user.name "AROMIA Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/editorial-v1/ambroxan-resin-abstract-01.jpg \
                  apps/web/public/editorial-v1/ropion-bordeaux-texture-01.jpg \
                  apps/web/public/editorial-v1/amouage-mineral-density-01.jpg \
                  art-direction/EDITORIAL_V1_FINAL_PHOTO_ASSETS.json
          git rm -r .asset-transport-v3 .asset-transport-v2 .asset-transport 2>/dev/null || true
          git rm -f .github/workflows/canva-asset-probe.yml \
                    .github/workflows/editorial-v1-photo-materialize-v2.yml 2>/dev/null || true
          git commit -m "art(editorial-v1): install final photographic assets"
          git push origin HEAD:feat/editorial-v1-implementation
