name: Editorial v1 deterministic photo transport

on:
  push:
    branches:
      - feat/editorial-v1-implementation
    paths:
      - .asset-transport-v2/READY

permissions:
  contents: write

jobs:
  reassemble-validate-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout active branch
        uses: actions/checkout@v4
        with:
          ref: feat/editorial-v1-implementation
          fetch-depth: 1

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Reassemble locked photographic master and materialize final JPEGs
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageEnhance, ImageFilter
          import base64, hashlib, io, json

          root = Path('.asset-transport-v2')
          chunks = sorted(root.glob('chunk-*.b64'))
          if len(chunks) != 10:
              raise SystemExit(f'expected 10 chunks, found {len(chunks)}')
          encoded = ''.join(p.read_text(encoding='ascii').strip() for p in chunks)
          raw = base64.b64decode(encoded, validate=True)
          master_sha = hashlib.sha256(raw).hexdigest()
          expected_master_sha = '0ad2c6cce0316c03a47d5ac859284849b774d4da9f141e205dfd4a45aac05ce9'
          if master_sha != expected_master_sha:
              raise SystemExit(f'master SHA mismatch: {master_sha}')
          if raw[:3] != b'\xff\xd8\xff':
              raise SystemExit(f'master invalid JPEG magic: {raw[:3].hex()}')

          src = Image.open(io.BytesIO(raw)).convert('RGB')
          if src.size != (1672, 940):
              raise SystemExit(f'master dimensions invalid: {src.size}')

          panels = {
              'ambroxan-resin-abstract-01.jpg': (0, 548, 0.56),
              'ropion-bordeaux-texture-01.jpg': (555, 1102, 0.49),
              'amouage-mineral-density-01.jpg': (1108, 1672, 0.52),
          }
          out = Path('apps/web/public/editorial-v1')
          out.mkdir(parents=True, exist_ok=True)
          manifest = {'transport':'chunked-base64-photographic-master','master_sha256':master_sha,'master_dimensions':[1672,940],'classification':'interpretive, not documentary','outputs':{}}

          for name, (x0,x1,bias) in panels.items():
              panel = src.crop((x0,0,x1,940))
              pw, ph = panel.size
              crop_h = min(round(pw/(16/9)), ph)
              cy = round(ph*bias)
              top = max(0, min(ph-crop_h, cy-crop_h//2))
              crop = panel.crop((0,top,pw,top+crop_h)).resize((1600,900), Image.Resampling.LANCZOS)
              crop = ImageEnhance.Contrast(crop).enhance(1.03)
              crop = ImageEnhance.Color(crop).enhance(0.97)
              crop = crop.filter(ImageFilter.UnsharpMask(radius=1.0, percent=65, threshold=3))
              path = out/name
              crop.save(path,'JPEG',quality=86,optimize=True,progressive=True,subsampling=2)
              data = path.read_bytes()
              if data[:3] != b'\xff\xd8\xff':
                  raise SystemExit(f'{name}: invalid JPEG magic')
              check = Image.open(path); check.verify()
              check = Image.open(path)
              if check.format != 'JPEG' or check.size != (1600,900):
                  raise SystemExit(f'{name}: decode validation failed {check.format} {check.size}')
              manifest['outputs'][name]={'sha256':hashlib.sha256(data).hexdigest(),'bytes':len(data),'magic':data[:3].hex(),'width':1600,'height':900,'format':'JPEG'}

          Path('art-direction/EDITORIAL_V1_FINAL_PHOTO_ASSETS.json').write_text(json.dumps(manifest,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(manifest,indent=2))
          PY

      - name: Commit only verified binaries and clean transport scaffolding
        run: |
          git config user.name "AROMIA Asset Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps/web/public/editorial-v1/ambroxan-resin-abstract-01.jpg \
                  apps/web/public/editorial-v1/ropion-bordeaux-texture-01.jpg \
                  apps/web/public/editorial-v1/amouage-mineral-density-01.jpg \
                  art-direction/EDITORIAL_V1_FINAL_PHOTO_ASSETS.json
          git rm -r .asset-transport-v2 .asset-transport || true
          git rm -f .github/workflows/editorial-v1-chunked-photo-transport.yml \
                    .github/workflows/canva-asset-probe.yml \
                    .github/workflows/editorial-v1-photo-materialize-v2.yml || true
          git commit -m "art(editorial-v1): install verified final photographic JPEGs"
          git push origin HEAD:feat/editorial-v1-implementation
