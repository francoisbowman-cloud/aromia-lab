# Disposable package migration rehearsal. Does not modify GitHub branches or main.
name: Aromia security upgrade rehearsal
on:
  pull_request:
    paths:
      - '.github/workflows/aromia-security-rehearsal.yml'
      - 'apps/web/package.json'
      - 'apps/web/package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security-rehearsal:
    name: Next 15 + Sharp + Tiptap compatibility trial
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Recompute ephemeral package and lockfile with patched candidates
        run: |
          npm install --package-lock-only --save-exact --ignore-scripts --no-audit --no-fund \
            next@15.5.28 react@19.2.3 react-dom@19.2.3 sharp@0.35.5 \
            @tiptap/react@3.32.1 @tiptap/pm@3.32.1 \
            @tiptap/starter-kit@3.32.1 @tiptap/extension-image@3.32.1
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Real Next HTTP smoke under patched dependencies
        run: node ../../scripts/qa/admin-runtime-smoke.mjs
      - name: Audit ephemeral production dependency graph
        run: |
          set +e
          npm audit --json --omit=dev > "$RUNNER_TEMP/aromia-rehearsal-audit.json"
          set -e
          node ../../scripts/qa/summarize-dependency-audit.mjs "$RUNNER_TEMP/aromia-rehearsal-audit.json" report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aromia-security-rehearsal-package-and-lock
          path: |
            apps/web/package.json
            apps/web/package-lock.json
          retention-days: 7
