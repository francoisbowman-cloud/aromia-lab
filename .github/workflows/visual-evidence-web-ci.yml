name: Visual evidence web verification
on:
  pull_request:
    paths:
      - 'apps/web/src/lib/visualEvidence*'
      - 'apps/web/src/lib/projectProgress*'
      - 'apps/web/src/lib/githubProgress.server*'
      - 'apps/web/src/components/admin/GitHubProgressStatus.tsx'
      - 'apps/web/src/app/api/admin/progress-status/**'
      - 'apps/web/src/components/admin/ProjectProgress.tsx'
      - 'apps/web/src/app/admin/(protected)/progreso/**'
      - 'apps/web/src/app/admin/(protected)/operaciones/page.tsx'
      - 'apps/web/src/app/api/admin/intelligence/visual-evidence/**'
      - 'apps/web/src/app/admin/(protected)/revision-visual/**'
      - 'apps/web/src/app/api/admin/intelligence/visual-reviews/**'
      - 'apps/web/src/components/admin/Sidebar.tsx'
      - '.github/workflows/visual-evidence-web-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  web-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
