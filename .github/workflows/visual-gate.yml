name: Hybrid Signature Visual Gate

on:
  pull_request:
    branches:
      - main

jobs:
  render-gate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium

      - name: Start deterministic mock API
        run: |
          cat > /tmp/aromia-mock-api.mjs <<'EOF'
          import http from 'node:http';
          const perfume = {
            id: 1, slug: 'baccarat-rouge-540', nombre: 'Baccarat Rouge 540', marca: 'Maison Francis Kurkdjian', genero: 'unisex',
            familia_olfativa: 'Ambarado floral', concentracion: 'Eau de Parfum',
            notas_salida: ['Azafrán', 'Jazmín'], notas_corazon: ['Amberwood', 'Ámbar gris'], notas_fondo: ['Resina de abeto', 'Cedro'],
            temporada_recomendada: ['otoño', 'invierno'], ocasion: ['noche', 'especial'], precio_referencia: 325, moneda: 'USD', categoria_precio: 'lujo',
            imagen_url: null, link_afiliado: null, rating_promedio: 4.7,
            descripcion_corta: 'Una firma luminosa y mineral donde el azafrán, las maderas ambaradas y el cedro construyen una estela reconocible.',
            resena_sintetizada: 'La comunidad destaca su estela, persistencia y carácter inmediatamente reconocible.', longevidad: 9, estela: 8, proyeccion: 8,
            retailers: [
              { id: 1, perfume_id: 1, nombre: 'Maison Francis Kurkdjian', detalle: 'Referencia oficial', precio: 325, moneda: 'USD', link_afiliado: '#', orden: 1 },
              { id: 2, perfume_id: 1, nombre: 'Retail partner', detalle: '100 ml', precio: 319, moneda: 'USD', link_afiliado: '#', orden: 2 }
            ]
          };
          const articles = [
            { id: 1, slug: 'perfume-cultura-material', titulo: 'El perfume también es cultura material', categoria: 'analisis', imagen_portada_url: null, meta_description: 'Objetos, memoria y deseo.', perfumes_relacionados: [1], publicado_en: '2026-08-01', autor: 'Aromia' },
            { id: 2, slug: 'leer-una-fragancia', titulo: 'Cómo leer una fragancia más allá de sus notas', categoria: 'guia', imagen_portada_url: null, meta_description: 'Una guía editorial.', perfumes_relacionados: [1], publicado_en: '2026-07-26', autor: 'Aromia' },
            { id: 3, slug: 'materias-ambaradas', titulo: 'La nueva gramática de los ámbares', categoria: 'tendencias', imagen_portada_url: null, meta_description: 'Materia y tendencia.', perfumes_relacionados: [1], publicado_en: '2026-07-18', autor: 'Aromia' },
            { id: 4, slug: 'azafran-perfumeria', titulo: 'Azafrán: brillo seco, cuero y temperatura', categoria: 'academia', imagen_portada_url: null, meta_description: 'Materia prima.', perfumes_relacionados: [1], publicado_en: '2026-07-12', autor: 'Aromia' }
          ];
          const server = http.createServer((req, res) => {
            res.setHeader('Content-Type', 'application/json');
            if (req.url === '/api/perfumes') return res.end(JSON.stringify([perfume]));
            if (req.url === '/api/perfumes/baccarat-rouge-540') return res.end(JSON.stringify(perfume));
            if (req.url === '/api/articulos') return res.end(JSON.stringify(articles));
            if (req.url?.startsWith('/api/articulos/')) {
              const slug = req.url.split('/').pop(); const article = articles.find(a => a.slug === slug);
              if (!article) { res.statusCode = 404; return res.end('{}'); }
              return res.end(JSON.stringify({ ...article, contenido_html: '<p>Una lectura editorial sobre perfume, materia y contexto.</p>' }));
            }
            res.statusCode = 404; res.end('{}');
          });
          server.listen(4000, '127.0.0.1');
          EOF
          node /tmp/aromia-mock-api.mjs > /tmp/mock-api.log 2>&1 &

      - name: Start web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 > /tmp/aromia-web.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/quiz >/dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/aromia-web.log
          exit 1

      - name: Capture desktop and mobile
        run: |
          mkdir -p visual-gate
          cat > visual-gate/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          const browser = await chromium.launch({ headless: true });
          const targets = [
            ['product', '/catalogo/baccarat-rouge-540'],
            ['magazine', '/magazine'],
            ['quiz', '/quiz']
          ];
          for (const [name, path] of targets) {
            for (const [mode, viewport] of [['desktop', { width: 1440, height: 1100 }], ['mobile', { width: 390, height: 844 }]]) {
              const page = await browser.newPage({ viewportSize: viewport, deviceScaleFactor: 1 });
              await page.goto(`http://127.0.0.1:3000${path}`, { waitUntil: 'networkidle' });
              await page.screenshot({ path: `visual-gate/${name}-${mode}.png`, fullPage: true });
              fs.writeFileSync(`visual-gate/${name}-${mode}.html`, await page.content());
              await page.close();
            }
          }
          await browser.close();
          EOF
          node visual-gate/capture.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: hybrid-signature-render-gate
          path: apps/web/visual-gate
          retention-days: 7
