name: Canva asset transport probe

on:
  push:
    branches:
      - feat/editorial-v1-implementation
    paths:
      - .github/workflows/canva-asset-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Canva view URL
        shell: bash
        run: |
          set -euxo pipefail
          curl -L --max-time 45 -A 'Mozilla/5.0' -D /tmp/headers.txt -o /tmp/page.html 'https://www.canva.com/d/8ZZZUbqx_jXlbpE'
          echo '--- final headers ---'
          tail -40 /tmp/headers.txt
          echo '--- bytes ---'
          wc -c /tmp/page.html
          echo '--- title/canonical hints ---'
          grep -Eio '<title>[^<]*|https://[^" ]+|DAHT7ZOzs7o|657717806' /tmp/page.html | head -80 || true
