name: Cross-site Visual Gate

on:
  pull_request:
    branches: [main]

jobs:
  render-global:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - name: Start mock API
        run: |
          cat > /tmp/aromia-global-api.mjs <<'EOF'
          import http from 'node:http';
          const p={id:1,slug:'baccarat-rouge-540',nombre:'Baccarat Rouge 540',marca:'Maison Francis Kurkdjian',familia_olfativa:'Ambarado floral',genero:'unisex',categoria_precio:'lujo',nicho_o_comercial:'nicho',precio_referencia:325,moneda:'USD',imagen_url:null,link_afiliado:null};
          http.createServer((req,res)=>{res.setHeader('Content-Type','application/json');if(req.url==='/api/perfumes')return res.end(JSON.stringify([p]));if(req.url==='/api/perfumes/baccarat-rouge-540')return res.end(JSON.stringify({...p,notas_salida:['Azafrán'],notas_corazon:['Ámbar'],notas_fondo:['Cedro'],retailers:[]}));if(req.url==='/api/articulos')return res.end('[]');res.statusCode=404;res.end('{}');}).listen(4000,'127.0.0.1');
          EOF
          node /tmp/aromia-global-api.mjs >/tmp/global-api.log 2>&1 &
      - name: Start web
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
        run: |
          npm run dev -- --hostname 127.0.0.1 >/tmp/global-web.log 2>&1 &
          for i in {1..60}; do if curl -fsS http://127.0.0.1:3000/catalogo >/dev/null; then exit 0; fi; sleep 2; done
          cat /tmp/global-web.log; exit 1
      - name: Capture global chrome
        run: |
          mkdir -p global-gate
          cat > global-gate/capture.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          for(const [mode,viewport] of [['desktop',{width:1440,height:1000}],['mobile',{width:390,height:844}]]){
            for(const [name,path] of [['catalog','/catalogo'],['quiz','/quiz']]){
              const page=await browser.newPage({viewport});
              await page.goto(`http://127.0.0.1:3000${path}`,{waitUntil:'networkidle'});
              await page.screenshot({path:`global-gate/${name}-${mode}.png`,fullPage:true});
              await page.close();
            }
          }
          await browser.close();
          EOF
          node global-gate/capture.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: cross-site-render-gate
          path: apps/web/global-gate
          retention-days: 7
